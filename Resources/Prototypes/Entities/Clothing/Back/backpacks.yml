- type: entity
  parent: [Clothing, ContentsExplosionResistanceBase, RecyclableItemClothBasic] # Frontier: added RecyclableItemClothBasic
  id: ClothingBackpack
  name: backpack
  description: 將它背在背上，然後把物品放進去。
  categories: [ HideSpawnMenu ] # Frontier
  components:
  - type: Sprite
    sprite: Clothing/Back/Backpacks/backpack.rsi
    state: icon
  - type: Item
    size: Huge
  - type: Clothing
    quickEquip: false
    slots:
    - back
  - type: Storage
    grid:
    - 0,0,6,3
    maxItemSize: Huge
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  # to prevent bag open/honk spam
  - type: UseDelay
    delay: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: AllowsSleepInside # Frontier
  - type: Tag
    tags:
    - WhitelistChameleon
    - Backpack

- type: entity
  parent: NFClothingBackpack # Frontier: ClothingBackpack<NFClothingBackpack
