  - type: CatWearable # Frontier

#Syndicate EVA Helmet
- type: entity
  parent: [ClothingHeadEVAHelmetBase, BaseC3SyndicateContraband, ContrabandClothing] # Frontier: BaseSyndicateContraband<BaseC3SyndicateContraband, added ContrabandClothing as parent
  id: ClothingHeadHelmetSyndicate
  name: Syndicate EVA 頭盔
  description: 一款簡約又時尚的 EVA 頭盔。專為在有限空間內展現極致酷帥風采而設計。
  components:
  - type: Sprite
    sprite: Clothing/Head/Helmets/eva_syndicate.rsi
  - type: Clothing
    sprite: Clothing/Head/Helmets/eva_syndicate.rsi
  - type: StaticPrice
    price: 500 # Suit is 1000

