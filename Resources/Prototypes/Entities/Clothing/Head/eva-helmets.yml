#Paramedic Void Helmet
- type: entity
  parent: [ ClothingHeadSuitWithLightBase, ClothingHeadEVAHelmetBase ] #Despite acting like a hardsuit helmet, since it inherits from EVA Helmet, it goes here.
  id: ClothingHeadHelmetVoidParamed
  name: 救護員虛空頭盔
  description: 一款專為救護人員設計的空心頭盔。
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Clothing/Head/Hardsuits/paramedhelm.rsi
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: equipped-head-light
      head-vox:
      - state: equipped-head-light-vox
      head-dog:
      - state: equipped-head-light-dog
      head-cat:
      - state: equipped-head-light-cat
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-head
      head-vox:
      - state: equipped-head-vox
      head-dog:
      - state: equipped-head-dog
      head-cat:
      - state: equipped-head-cat
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: Armor
    modifiers:
      coefficients:
        Heat: 0.90
        Radiation: 0.75
  - type: PointLight
    radius: 5
    energy: 2
    color: "#00ffff"
  - type: Tag
    tags:
    - CorgiWearable
    - HelmetEVA
    - WhitelistChameleon
  - type: CatWearable # Frontier
