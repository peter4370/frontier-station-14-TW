#Ancient Void Helmet
- type: entity
  parent: ClothingHeadEVAHelmetBase
  id: ClothingHeadHelmetAncient
  name: NTSRA 無內襯安全帽
  description: 一款由中央司令部（CentCom）轄下 NTSRA 分部設計的古代太空頭盔。
  components:
  - type: Sprite
    sprite: Clothing/Head/Helmets/ancientvoidsuit.rsi
