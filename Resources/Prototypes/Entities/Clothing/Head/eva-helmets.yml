#EVA Helmet
- type: entity
  parent: ClothingHeadEVAHelmetBase
  id: ClothingHeadHelmetEVA
  name: EVA 頭盔
  description: 一款專為太空行走設計、雖舊卻經典的頭盔。因常讓安保人員感到疑神疑鬼而臭名昭著。
  components:
  - type: Sprite
    sprite: Clothing/Head/Helmets/eva.rsi
  - type: Clothing
    sprite: Clothing/Head/Helmets/eva.rsi
  - type: Tag
    tags:
    - HelmetEVA
    - WhitelistChameleon
    - CorgiWearable

#Large EVA Helmet
- type: entity
  parent: ClothingHeadEVAHelmetBase
  id: ClothingHeadHelmetEVALarge
  name: EVA helmet
  description: 一款專為太空行走設計、經典不衰的頭盔。
  components:
  - type: Sprite
    sprite: Clothing/Head/Helmets/eva_large.rsi
  - type: Clothing
    sprite: Clothing/Head/Helmets/eva_large.rsi
  - type: Tag
    tags:
