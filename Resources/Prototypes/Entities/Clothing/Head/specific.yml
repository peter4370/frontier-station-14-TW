- type: entity
  parent: [ClothingHeadBase, BaseChameleon]
  id: ClothingHeadHatChameleon
  name: beret
  description: 一頂貝雷帽，是藝術家最喜愛的頭飾。
  suffix: Chameleon
  components:
    - type: Tag
      tags: [] # ignore "WhitelistChameleon" tag
    - type: Sprite
      sprite: Clothing/Head/Hats/beret.rsi
    - type: Clothing
      sprite: Clothing/Head/Hats/beret.rsi
    - type: ChameleonClothing
      slot: [HEAD]
      default: ClothingHeadHatBeret

- type: entity
  parent: ClothingHeadHatFedoraBrown
  id: ClothingHeadHatDetGadget
  name: go go 帽子
  description: 一款內建工具組的創新帽子。只要說出一句口令，就能自動收納和取出物品！
  components:
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag
  - type: TriggerOnVoice
    keyPhrase: "go go gadget"
    listenRange: 0
  - type: ActiveListener
    range: 0
  - type: StorageVoiceControl
    allowedSlots:
    - HEAD
  - type: Storage
    showVerb: false
    grid:
    - 0,0,3,2
    maxItemSize: Small
    blacklist:
      tags:
      - HighRiskItem # no hiding objectives or trolling nukies
      - FakeNukeDisk # no disk checking
      - QuantumSpinInverter # avoid the morbillionth QSI bug
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
