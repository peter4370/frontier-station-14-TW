- type: entity
  parent: ClothingHeadHatHardhatBase
  id: ClothingHeadHatHardhatArmored
  name: 防撞安全帽
  description: 一款防彈安全帽。在防護與實用性兩方面皆能兼顧，堪稱兩全其美——非常適合身處第一線的工程師。
