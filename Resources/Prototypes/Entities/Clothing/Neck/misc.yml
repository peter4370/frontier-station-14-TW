- type: entity
  parent: Clothing
  id: ClothingNeckStethoscope
  name: 聽診器
  description: 一款過時的醫療儀器，用來聽取人體的聲音。它還能讓你看起來像個行家。
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Clothing/Neck/Misc/stethoscope.rsi
    state: icon
  - type: Clothing
    sprite: Clothing/Neck/Misc/stethoscope.rsi
    quickEquip: true
    slots:
    - neck
  - type: Stethoscope

- type: entity
  parent: BaseAction
  id: ActionStethoscope
  name: Listen with stethoscope
  components:
  - type: Action
    icon:
      sprite: Clothing/Neck/Misc/stethoscope.rsi
      state: icon
    priority: -1
    itemIconStyle: BigAction
    checkCanInteract: false
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:StethoscopeActionEvent

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckBling
  name: bling
  description: 該死，當個黑幫分子真爽。
  components:
  - type: Sprite
    sprite: Clothing/Neck/Misc/bling.rsi
  - type: Clothing
    sprite: Clothing/Neck/Misc/bling.rsi
  - type: Item
    sprite: Clothing/Neck/Misc/bling.rsi
  - type: NFTreasure # Frontier

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckLawyerbadge
  name: 律師證章
  description: 一枚徽章，用以證明持有者是通過北領地律師資格考試、具備執業資格的「合法」律師。
  components:
  - type: Sprite
    sprite: Clothing/Neck/Misc/lawyerbadge.rsi
  - type: Clothing
    sprite: Clothing/Neck/Misc/lawyerbadge.rsi
  - type: TypingIndicatorClothing
    proto: lawyer

- type: entity
  parent: ClothingNeckBase
  id: Dinkystar
  name: 星星貼紙
  description: 一顆小小的星星，專獻給最勤奮的保全人員！它甚至已經不黏了。
  components:
  - type: Sprite
    sprite: Clothing/Neck/Misc/dinkystar.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Trash
    - WhitelistChameleon
