#Where all of the uniforms for the yet-to-be-implimented ship vs. ship gamemode go (or Nanotrasen VS. Syndicate, if you'd like.)
#In its own file to further avoid bloating jumpsuits.yml.

#CREW
#Recruit
- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitRecruitNT
  name: 新兵連身工作服
  description: 一款配有藍色滾邊的優雅灰色連身工作服，非常適合氣質端莊的助手。
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuit/recruit_nt.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuit/recruit_nt.rsi

- type: entity
  parent: [ ClothingUniformBase, BaseC3SyndicateContrabandNoValue ] # Frontier: BaseSyndicateContraband<BaseC3SyndicateContrabandNoValue
  id: ClothingUniformJumpsuitRecruitSyndie
  name: 黑幫招募連身衣
  description: 一套令人起疑的深灰色連身工作服。彷彿乘客們還不夠心存疑慮似的。
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuit/recruit_syndie.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuit/recruit_syndie.rsi

#Repairman
- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitRepairmanNT
  name: 維修工連身工作服
  description: 這件連身工作服會讓你聯想到某個船員部門的工作崗位。但願你不必像那些怪胎一樣做同樣的工作。
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuit/repairman_nt.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuit/repairman_nt.rsi

- type: entity
  parent: [ ClothingUniformBase, BaseC3SyndicateContrabandNoValue ] # Frontier: BaseSyndicateContraband<BaseC3SyndicateContrabandNoValue
  id: ClothingUniformJumpsuitRepairmanSyndie
  name: 黑幫維修工連身工作服
  description: 實用、時尚又酷勁十足。Nanotrasen 的工程師們都希望自己也能像這件單品一樣帥氣。
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuit/repairman_syndie.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuit/repairman_syndie.rsi

#Paramedic
- type: entity
  parent: [ ClothingUniformBase, BaseC3SyndicateContrabandNoValue ] # Frontier: BaseSyndicateContraband<BaseC3SyndicateContrabandNoValue
  id: ClothingUniformJumpsuitParamedicSyndie
  name: '「辛迪加」救護員連身工作服'
  description: 不知為何，穿上這件衣服會讓人覺得自己似乎快要違反《日內瓦公約》了。
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuit/paramedic_syndie.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuit/paramedic_syndie.rsi

