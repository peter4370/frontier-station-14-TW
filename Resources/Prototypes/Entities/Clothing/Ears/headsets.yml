- type: entity
  abstract: true
  parent: [Clothing, RecyclableItemClothDevice] # Frontier: added RecyclableItemClothDevice
  id: ClothingHeadset
  name: headset
  description: 一款經過升級、採用模組化設計的頭戴式對講機。可存放加密金鑰。
  components:
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
  - type: Headset
  - type: EncryptionKeyHolder
    keySlots: 10 # Frontier 4<10
  - type: Sprite
    state: icon
  - type: Item
    size: Small
  - type: Clothing
    slots:
    - ears
    sprite: Clothing/Ears/Headsets/base.rsi
  - type: GuideHelp
    guides:
    - Radio

