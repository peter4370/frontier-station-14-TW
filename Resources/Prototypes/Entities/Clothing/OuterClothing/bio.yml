  description: 一款能防範生物污染的高階防護服，採用 CMO 配色。
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Bio/cmo.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Bio/cmo.rsi

