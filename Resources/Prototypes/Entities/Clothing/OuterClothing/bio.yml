- type: entity
  parent: ClothingOuterBaseLarge
  id: ClothingOuterBioGeneral
  name: 生物防護服
  suffix: Generic
  description: 一套能防止生物污染的防護服。
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Bio/general.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Bio/general.rsi
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.5 # Frontier: 0.75<0.5
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.35
  - type: GroupExamine
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: StaticPrice # Frontier
    vendPrice: 400 # Frontier

- type: entity
  parent: ClothingOuterBioGeneral
  id: ClothingOuterBioCmo
  name: bio suit
