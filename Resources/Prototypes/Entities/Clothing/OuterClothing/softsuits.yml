#Basic EVA
- type: entity
  parent: ClothingOuterEVASuitBase
  id: ClothingOuterHardsuitEVA
  name: EVA 防護服
  description: 一款輕量級太空服，具備在緊急情況下保護穿著者免受太空真空環境危害的基本能力。
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva.rsi
  - type: Tag
    tags:
    - SuitEVA
    - MonkeyWearable
    - CorgiWearable
    - WhitelistChameleon
  - type: StaticPrice # Frontier
    price: 30 # Frontier
    vendPrice: 1500 # Frontier

#Syndicate EVA
- type: entity
  parent: [ClothingOuterEVASuitBase, BaseC3SyndicateContraband, ContrabandClothing] # Frontier: added BaseC3SyndicateContraband, ContrabandClothing as parent
  id: ClothingOuterEVASuitSyndicate
  name: 辛迪加 EVA 戰衣
  description: "背面貼有標籤，上面寫著：「這絕對不是敵對企業的財產，真的！」"
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva_syndicate.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva_syndicate.rsi
  - type: Tag
    tags:
    - SuitEVA
    - MonkeyWearable
    - WhitelistChameleon
  - type: StaticPrice
    price: 1000 # Helmet is 500

#Emergency EVA
- type: entity
  parent: NFClothingOuterEVASuitBase # Frontier: ClothingOuterEVASuitBase<NFClothingOuterEVASuitBase
  id: ClothingOuterSuitEmergency
  name: 緊急出艙服
  description: 一款內建頭盔的緊急太空行走服。雖然行動速度極其緩慢，且缺乏溫度保護功能，但足以讓你在殘酷的太空真空中爭取一些時間。
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva_emergency.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva_emergency.rsi
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: HeldSpeedModifier
  - type: TemperatureProtection
    heatingCoefficient: 0.75
    coolingCoefficient: 0.5
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetEVALarge
    slot: head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
      storagebase: !type:Container # Frontier
        ents: [] # Frontier
  - type: Tag
    tags:
    - CorgiWearable
    - ScurretWearable
    - MonkeyWearable
    - WhitelistChameleon
  - type: CatWearable # Frontier

#Prisoner EVA
- type: entity
  parent: ClothingOuterEVASuitBase
