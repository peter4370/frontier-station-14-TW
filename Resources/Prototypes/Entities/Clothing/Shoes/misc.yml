- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesBootsJump
  name: 跳躍靴
  description: 這雙高科技靴子能賦予你驚人的跳躍能力！穿上這雙靴子，你就能跳過熔岩、深淵，以及地面上的各種奇怪化學物質！
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/jumpboots.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: Clothing/Shoes/Boots/jumpboots.rsi
  - type: JumpAbility
    jumpDistance: 4
    jumpSound: /Audio/Effects/stealthoff.ogg
  - type: ActionGrant
    actions:
    - ActionGravityJump
  - type: ItemActionGrant
    actions:
    - ActionGravityJump
    activeIfWorn: true
  - type: StaticPrice
    price: 220
  - type: Tag
    tags: []
