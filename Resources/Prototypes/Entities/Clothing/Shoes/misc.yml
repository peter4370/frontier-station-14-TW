- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoeSlippersDuck
  name: 小鴨拖鞋
  description: 你真希望這些東西在你走路時能發出「嘎嘎」的叫聲。不過，好在它們沒有這樣做。
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Misc/duck-slippers.rsi
  - type: ToggleClothing #Frontier: Fixes Ducky Slippers to prevent waddling without wearing.
    action: ActionToggleWaddling #Frontier: Fixes Ducky Slippers to prevent waddling without wearing.
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepDuck # Frontier: Upstream removed Quack!
      params:
        variation: 0.07
  - type: Construction
    graph: ClothingShoeSlippersDuck
    node: shoes
  - type: WaddleWhenWorn # DeltaV - upstream removed waddling
    tumbleIntensity: 10 # DeltaV - smaller than clown shoes
    waddlingAlert: Waddling #Frontier: Fixes Ducky Slippers to prevent waddling without wearing.
  #start imp edit
  - type: ItemToggle
    activated: true #Frontier: Fixes Ducky Slippers to prevent waddling without wearing.
    onUse: false #Frontier: Fixes Ducky Slippers to prevent waddling without wearing.
    onActivate: false #Frontier: Fixes Ducky Slippers to prevent waddling without wearing.
    soundActivate:
      path: /Audio/Items/Toys/quack.ogg
    soundDeactivate:
      path: /Audio/Items/Toys/quack.ogg
  #end imp edit

- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoeSlippersLizard
  name: 蜥蜴絨毛拖鞋
  description: 一雙造型可愛、酷似蜥蜴人的拖鞋。搭配其他綠色服裝，你就會成為太空站上最酷的船員！
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Misc/lizard-slippers.rsi
  - type: ToggleClothing # Frontier "Clothing" > "ToggleClothing" : Add waddling to Lizard Slippers
    action: ActionToggleWaddling # Frontier "sprite: Clothing/Shoes/Misc/lizard-slippers.rsi" > "action: ActionToggleWaddling" : Add waddling to Lizard Slippers
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Items/Toys/weh.ogg #Frontier: Changed from Collection FootstepCarpet to path weh.ogg
      params:
        variation: 0.02
  - type: Construction
    graph: ClothingShoeSlippersLizard
    node: shoes
  - type: Edible
    useSound:
      path: /Audio/Items/Toys/weh.ogg # Copied from lizard plush sound
      params:
        volume: -5
    transferAmount: 10
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuiceThatMakesYouWeh
        Quantity: 60
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 40
        reagents:
        - ReagentId: Fiber
          Quantity: 20
        - ReagentId: JuiceThatMakesYouWeh
          Quantity: 20
  # Frontier : Add waddling to Lizard Slippers
  - type: WaddleWhenWorn
    tumbleIntensity: 10
    waddlingAlert: Waddling
  - type: ItemToggle
    activated: true
    onUse: false
    onActivate: false
    soundActivate:
      path: /Audio/Items/Toys/weh.ogg
    soundDeactivate:
      path: /Audio/Items/Toys/weh.ogg
  # End Frontier

