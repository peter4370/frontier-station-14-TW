- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesChef
  name: 廚師鞋
  description: 堅固的鞋子，能將墜落物或刀具造成的傷害降至最低。
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Specific/chef.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Specific/chef.rsi

# stuff common to all clown & jester shoes
- type: entity
  abstract: true
  parent: [ClothingShoesBaseButcherable, ClothingSlotBase]
  id: ClothingShoesClownBase
  components:
  - type: ItemSlots
    slots:
      item:
        name: clothing-boots-sidearm
        whitelist:
          tags:
          - Knife
          - ToySidearm
        blacklist:
          components:
          - Sharp
  #begin imp edit
  - type: ItemToggle
    activated: true
    onUse: false
    onActivate: false
    soundActivate:
      collection: BikeHorn
    soundDeactivate:
      collection: BikeHorn
      params:
        pitch: .8
  - type: ToggleClothing
    action: ActionToggleWaddling
  - type: WaddleWhenWorn
    waddlingAlert: Waddling
  #end imp edit

- type: entity
  parent: ClothingShoesClownBase
  id: ClothingShoesClown
  name: clown shoes
  description: "惡作劇者標配的小丑鞋。天啊，這鞋也太大了吧！"
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Specific/clown.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Specific/clown.rsi
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepClown
      params:
        variation: 0.17
  # for H.O.N.K. construction
  - type: Tag
    tags:
    - ClownShoes
    - WhitelistChameleon

- type: entity
  parent: ClothingShoesClown
  id: ClothingShoesClownBanana
  name: 香蕉小丑鞋
  description: "當幽默與鞋履結合，便能將荒謬感提升至全新境界。"
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Specific/clown_banana.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Specific/clown_banana.rsi
  #- type: FootstepModifier You can add a sound effect when you make one that doesn't sound like a dog dying. -emo
  #  footstepSoundCollection:
  #    collection: FootstepSlip
  #    params:
  #      volume: -10
  #      variation: 0.10
  - type: Construction
    graph: BananaClownShoes
    node: shoes
  - type: Skates
    minimumSpeed: 20
    acceleration: 5

- type: entity
  parent: ClothingShoesClownBase
  id: ClothingShoesBling
  name: 閃亮小丑鞋
  description: 採用精煉的香蕉金屬製成，並以新鮮香蕉皮的果肉拋光。這些飾品展現出耀眼奪目的風采。
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Specific/bling.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Specific/bling.rsi
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepClown
      params:
        variation: 0.17
  - type: PointLight
    enabled: true
    radius: 3
    energy: 2
    color: "#FFD800"
    netsync: false

- type: entity
