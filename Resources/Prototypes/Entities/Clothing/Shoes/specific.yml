- type: entity
  parent: [ClothingShoesBaseButcherable, BaseC3Contraband, ContrabandClothing ] # Frontier: BaseMajorContraband<BaseC3Contraband, added ContrabandClothing
  id: ClothingShoesSpaceNinja
  name: 太空忍者鞋
  description: 一雙配備內建磁性吸盤的奈米強化靴。
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Specific/spaceninja.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Specific/spaceninja.rsi
  - type: NoSlip
  - type: Magboots # always have gravity because le suction cups
  - type: ClothingSpeedModifier
    # ninja are masters of sneaking around relatively quickly, won't break cloak
    walkModifier: 1.3
    sprintModifier: 1.3
  - type: FootstepModifier
    footstepSoundCollection: null

