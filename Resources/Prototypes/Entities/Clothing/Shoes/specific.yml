  suffix: No-slip, Chameleon
  description: Stylish black shoes.
  components:
  - type: NoSlip
  - type: Contraband # Frontier
    hideValues: true # Frontier

- type: entity
  parent: ClothingShoesClown
  id: ClothingShoesJester
  name: 小丑鞋
  description: 一名宮廷小丑的鞋子，融入了現代的吱吱作響技術。
  components:
    - type: Sprite
      sprite: Clothing/Shoes/Specific/jester.rsi
    - type: Clothing
      sprite: Clothing/Shoes/Specific/jester.rsi
    - type: FootstepModifier
      footstepSoundCollection:
        collection: FootstepJester
        params:
          variation: 0.07
    #start imp edit
    - type: ItemToggle
      soundActivate:
        path: /Audio/Effects/Footsteps/jesterstep1.ogg
      soundDeactivate:
        path: /Audio/Effects/Footsteps/jesterstep2.ogg
    #end imp edit

