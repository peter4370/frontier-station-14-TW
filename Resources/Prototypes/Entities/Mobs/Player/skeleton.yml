- type: entity
  save: false
  parent: BaseMobSkeletonPerson
  id: MobSkeletonPerson
  components:
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others

- type: entity
  name: 骷髏海盜
  parent: MobSkeletonPerson
  id: MobSkeletonPirate
  components:
  - type: GhostRole
    name: 幽靈角色資訊－骷髏海盜－名字
    description: 幽靈角色資訊－骷髏海盜－描述
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgent
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: Loadout
    prototypes: [PirateGear]
  - type: RandomHumanoidAppearance


- type: entity
  name: 骷髏騎士
  parent: MobSkeletonPerson
  id: MobSkeletonBiker
  components:
  - type: GhostRole
    name: 幽靈角色資訊模板－機車騎士－姓名
    description: 幽靈角色資訊－骨架機車騎士－描述
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgent
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: Loadout
    prototypes: [SkeletonBiker]
  - type: RandomHumanoidAppearance

- type: entity
  parent: MobSkeletonPerson
  id: MobSkeletonCloset
  name: 衣櫥裡的骷髏
  components:
  - type: GhostRole
    name: ghost-角色資訊-衣櫥-骨架名稱
    description: ghost-role-information-closet-skeleton-description
    rules: ghost-role-information-freeagent-rules
