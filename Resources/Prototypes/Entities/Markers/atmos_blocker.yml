- type: entity
  name: Atmos Fix 真空標記筆
  id: AtmosFixBlockerMarker
  description: "真空，T20C"
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: Markers/atmos.rsi # {
          state: base
          shader: unshaded
        - sprite: Markers/atmos.rsi
          shader: unshaded # }
          state: vacuum
    - type: AtmosFixMarker
      mode: 1

- type: entity
  name: Atmos Fix 氧氣標記劑
  id: AtmosFixOxygenMarker
  description: "氧氣 @ 氣體開採壓力，T20C"
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: Markers/atmos.rsi # {
          state: base
          shader: unshaded
        - sprite: Markers/atmos.rsi
          shader: unshaded # }
          state: oxygen
    - type: AtmosFixMarker
      mode: 2

- type: entity
  name: Atmos 固定氮標記劑
  id: AtmosFixNitrogenMarker
  description: "氮氣 @ 氣體採礦器壓力，T20C"
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: Markers/atmos.rsi # {
          state: base
          shader: unshaded
        - sprite: Markers/atmos.rsi
          shader: unshaded # }
          state: nitrogen
    - type: AtmosFixMarker
      mode: 3

- type: entity
  name: Atmos Fix 等離子標記機
  id: AtmosFixPlasmaMarker
  description: "等離子體 @ 氣體開採壓力，T20C"
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: Markers/atmos.rsi # {
          state: base
          shader: unshaded
        - sprite: Markers/atmos.rsi
          shader: unshaded # }
          state: plasma
    - type: AtmosFixMarker
      mode: 4

- type: entity
  name: Atmos Fix 瞬間點火等離子火炬
  id: AtmosFixInstantPlasmaFireMarker
  description: "瞬間等離子火焰"
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: Markers/atmos.rsi # {
          state: base-hot
          shader: unshaded
        - sprite: Markers/atmos.rsi
          shader: unshaded # }
          state: fire
    - type: AtmosFixMarker
      mode: 5

- type: entity
  name: Atmos Fix 冷凍庫專用標記筆
  id: AtmosFixFreezerMarker
  description: "將氣溫設定為 235K，讓冷凍櫃在設定時留有少許調整空間。"
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: Markers/atmos.rsi # {
          state: base
          shader: unshaded
        - sprite: Markers/atmos.rsi
          shader: unshaded # }
          state: freeze
    - type: AtmosFixMarker
      mode: 6

- type: entity
  parent: AtmosFixNitrogenMarker
  id: AtmosFixVoxMarker
  suffix: Vox Atmosphere
  description: "氮氣 @ 101 kPa，20°C"
  components:
  - type: AtmosFixMarker
    mode: 7

- type: entity
  parent: MarkerBase
  id: AtmosFixAirMarker
  name: Atmos Fix 空氣標記筆
  description: "氧氣（21%）與氮氣（79%），在氣體礦工壓力下，T20C"
  components:
  - type: Sprite
    layers:
    - sprite: Markers/atmos.rsi # {
      state: base
      shader: unshaded
    - sprite: Markers/atmos.rsi
      shader: unshaded # }
      state: air
  - type: AtmosFixMarker
    mode: 8
