- type: entity
  id: RandomWoodenSupport
  name: 木製支撐生成器
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: Objects/Decoration/mines.rsi
        state: support
  - type: RandomSpawner
    prototypes:
      - WoodenSupport
      - WoodenSupportBeam
      - WoodenSupportBeam
      - WoodenSupportBeam
    chance: 0.9

- type: entity
  id: RandomWoodenWall
  name: 木製牆面生成器
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: Objects/Decoration/mines.rsi
        state: support_wall
  - type: RandomSpawner
    prototypes:
      - WoodenSupportWall
      - WoodenSupportWallBroken
    chance: 0.9

- type: entity
  id: RandomStalagmiteOrCrystal
  name: 石筍或水晶生成器
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: Objects/Decoration/Flora/flora_stalagmite.rsi
        state: stalagmite2
  - type: RandomSpawner
    offset: 0.3
    prototypes:
      - RandomBrownStalagmite
      - RandomGreyStalagmite
      - CrystalSpawner
    chance: 0.9

