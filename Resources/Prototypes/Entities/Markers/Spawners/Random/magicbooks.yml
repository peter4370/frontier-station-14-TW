- type: entity
  id: RandomMagicBook
  name: 隨機魔法書生成器
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - state: red
        - sprite: Objects/Misc/books.rsi
          state: book_icon
    - type: RandomSpawner
      prototypes:
        - SpawnSpellbook
        - ForceWallSpellbook
        - BlinkBook
        - KnockSpellbook
        - FireballSpellbook
        - ScrollRunes
        - SmiteBook
      chance: 1

- type: entity
  id: RandomMagicBookSafe
  name: 隨機魔法書生成器 [安全]
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - state: red
        - sprite: Objects/Misc/books.rsi
          state: book_icon
    - type: RandomSpawner
      prototypes:
        - SpawnSpellbook
        - ForceWallSpellbook
        - BlinkBook
        - KnockSpellbook
        - ScrollRunes
      chance: 1
