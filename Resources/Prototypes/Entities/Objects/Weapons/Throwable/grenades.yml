    duration: 15
    spreadAmount: 50
    smokePrototype: Foam
    solution:
      reagents:
      - ReagentId: SpaceCleaner
        Quantity: 30
  - type: NFCleanade # Frontier

- type: entity
  parent: SmokeGrenade
  id: TearGasGrenade
  name: 催淚瓦斯手榴彈
  description: 一枚鎮暴用催淚瓦斯手榴彈。會引起刺激感、疼痛，並讓你淚流不止。
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/tear_gas.rsi
  - type: SmokeOnTrigger
    keysIn:
    - timer
    duration: 10
    spreadAmount: 30
    smokePrototype: TearGasSmokeWhite
    solution:
      reagents:
      - ReagentId: TearGas
        Quantity: 20

- type: entity
  parent: [ BaseClearContraband, SmokeGrenade ] # Frontier: BaseEngineeringContraband<BaseClearContraband
  id: MetalFoamGrenade
  name: 金屬泡沫手榴彈
  description: 一種用於以特殊快乾金屬泡沫修補船體破洞的緊急工具。效果幾乎和真正的地板一樣好！
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/metalfoam.rsi
  - type: TimerTrigger
    delay: 5
  - type: SmokeOnTrigger
    keysIn:
    - timer
    duration: 10
    spreadAmount: 20
    smokePrototype: AluminiumMetalFoam
  - type: StaticPrice
    price: 350

- type: entity
  parent: GrenadeBase # Prevent inheriting DeleteOnTrigger from SmokeGrenade # Frontier: removed BaseEngineeringContraband
  id: AirGrenade
  name: 癱瘓手榴彈
  description: 一種特殊的固態化學手榴彈，用於將標準空氣迅速釋放至特定區域。可填滿多達 30 格！
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/airboom.rsi
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound: /Audio/Items/smoke_grenade_smoke.ogg
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Items/smoke_grenade_prime.ogg
  - type: TimerTrigger
    delay: 3
  - type: ReleaseGasOnTrigger
    keysIn:
    - timer
    removeFraction: 0.25
    air:
      volume: 1000
      moles: # Target is 3117.84 mols total for filling 30 tiles (goal is 101.325 kPa @ 20C)
      - 654.7464 # oxygen
      - 2463.0936 # nitrogen
      temperature: 293.15
  - type: StaticPrice
    price: 350
  - type: GenericVisualizer
    visuals:
      enum.ReleaseGasOnTriggerVisuals.Key:
        enabled:
          True: { state: active }
          False: { state: spent }

