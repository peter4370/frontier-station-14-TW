- type: entity
  id: BaseCartridgePistol
  name: 子彈（.35 Auto）
  parent: [ BaseCartridge, BaseC1Contraband ] # Frontier: BaseSecurityContraband<BaseC1Contraband
  abstract: true
  components:
  - type: Tag
    tags:
      - Cartridge
      - CartridgePistol
  - type: CartridgeAmmo
    # proto: BulletPistol # Frontier
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 1

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: CartridgePistol
  name: cartridge (.35 auto)
  description: 這可說是市面上最受歡迎的口徑，廣泛應用於各類手槍和衝鋒槍。標準動能彈藥十分常見，且在大多數情況下都相當實用。
  parent: BaseCartridgePistol
  components:
  - type: CartridgeAmmo
    # proto: BulletPistol # Frontier

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: CartridgePistolPractice
  name: 子彈（.35 Auto 練習彈）
  description: 這可說是市面上最受歡迎的口徑，各類手槍和衝鋒槍皆採用此口徑。石灰彈通常無害，主要用於練習。
  parent: BaseCartridgePistol
  components:
  - type: CartridgeAmmo
    # proto: BulletPistolPractice # Frontier
  -  type: Sprite
     layers:
       - state: base
         map: [ "enum.AmmoVisualLayers.Base" ]
       - state: tip
         map: [ "enum.AmmoVisualLayers.Tip" ]
         color: "#dbdbdb"

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: CartridgePistolIncendiary
  name: 子彈（.35自動燃燒彈）
  description: 這可說是市面上最受歡迎的口徑，廣泛應用於各類手槍和衝鋒槍。燃燒彈藥含有自燃化合物，能使目標起火燃燒。
  parent: BaseCartridgePistol
  components:
  - type: CartridgeAmmo
    # proto: BulletPistolIncendiary # Frontier
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#ff6e52"

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: CartridgePistolUranium
  name: 子彈彈匣（.35 Auto 鈾彈）
  description: 這可說是市面上最受歡迎的口徑，廣泛應用於各類手槍和衝鋒槍。鈾芯彈藥內含裂變物質，能從內部輻射目標。
  parent: BaseCartridgePistol
  components:
  - type: CartridgeAmmo
    # proto: BulletPistolUranium # Frontier
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#65fe08"

- type: entity
  id: CartridgePistolSpent
  name: cartridge (.35 auto)
  suffix: spent
  parent: BaseCartridgePistol
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base-spent
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: SpentAmmoVisuals
  - type: CartridgeAmmo
    proto: BulletPistol
    spent: true
