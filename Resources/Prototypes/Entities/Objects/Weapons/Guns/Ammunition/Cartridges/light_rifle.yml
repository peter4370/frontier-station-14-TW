- type: entity
  id: BaseCartridgeLightRifle
  name: 子彈（.30 步槍）
  parent: [ BaseCartridge, BaseC1Contraband ] # Frontier: BaseSecurityContraband<BaseC1Contraband
  abstract: true
  components:
  - type: Tag
    tags:
    - Cartridge
    - CartridgeLightRifle
  - type: CartridgeAmmo
    # proto: BulletLightRifle # Frontier
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 1

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: CartridgeLightRifle
  name: cartridge (.30 rifle)
  parent: BaseCartridgeLightRifle
  description: 一種經典的中口徑彈藥，廣泛應用於許多戰鬥步槍和輕機槍。標準動能彈藥在大多數情況下都很常見且實用。
  components:
  - type: CartridgeAmmo
    # proto: BulletLightRifle # Frontier

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: CartridgeLightRiflePractice
  name: 子彈（.30 步槍練習用）
  parent: BaseCartridgeLightRifle
  description: 一種經典的中口徑彈藥，廣泛應用於許多戰鬥步槍和輕機槍。白堊彈通常無害，用於練習。
  components:
  - type: CartridgeAmmo
    # proto: BulletLightRiflePractice # Frontier
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#dbdbdb"

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: CartridgeLightRifleIncendiary
  name: 子彈（.30 步槍燃燒彈）
  parent: BaseCartridgeLightRifle
  description: 一種經典的中口徑彈藥，廣泛應用於許多戰鬥步槍和輕機槍。燃燒彈內含自燃化合物，可使目標起火燃燒。
  components:
  - type: CartridgeAmmo
    # proto: BulletLightRifleIncendiary # Frontier
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#ff6e52"

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: CartridgeLightRifleUranium
  name: 子彈（.30 步槍鈾彈）
  parent: BaseCartridgeLightRifle
  description: 一種經典的中口徑彈藥，廣泛應用於許多戰鬥步槍和輕機槍。鈾彈藥將子彈的鉛芯替換為可裂變材料，從內部對目標進行輻射照射。
  components:
  - type: CartridgeAmmo
    # proto: BulletLightRifleUranium # Frontier
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#65fe08"
