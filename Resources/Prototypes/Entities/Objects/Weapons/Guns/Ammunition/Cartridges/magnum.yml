- type: entity
  id: BaseCartridgeMagnum
  name: 子彈（.45馬格南）
  parent: [ BaseCartridge, BaseC1Contraband ] # Frontier: BaseSecurityContraband<BaseC1Contraband
  abstract: true
  components:
  - type: Tag
    tags:
      - Cartridge
      - CartridgeMagnum
  - type: CartridgeAmmo
    # proto: BulletMagnum # Frontier
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 1

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: CartridgeMagnum
  name: cartridge (.45 magnum)
  parent: BaseCartridgeMagnum
  description: 大口徑馬格南子彈，主要用於轉輪手槍。標準動能彈藥在大多數情況下都很常見且實用。
  components:
  - type: CartridgeAmmo
    # proto: BulletMagnum # Frontier

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: CartridgeMagnumPractice
  name: 子彈（.45馬格南練習彈）
  parent: BaseCartridgeMagnum
  description: 一種主要用於左輪手槍的重型馬格南子彈。白堊彈通常無害，用於練習。
  components:
  - type: CartridgeAmmo
    # proto: BulletMagnumPractice # Frontier
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#dbdbdb"

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: CartridgeMagnumIncendiary
  name: 子彈（.45馬格南燃燒彈）
  parent: BaseCartridgeMagnum
  description: 一種主要用於轉輪手槍的重型馬格南子彈。燃燒彈內含自燃化合物，能使目標起火燃燒。
  components:
  - type: CartridgeAmmo
    # proto: BulletMagnumIncendiary # Frontier
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#ff6e52"

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: CartridgeMagnumAP
  name: 子彈（.45馬格南穿甲彈）
  parent: BaseCartridgeMagnum
  description: 這種重型馬格南子彈主要用於轉輪手槍。穿甲彈以其能直接貫穿防彈衣而聞名。
  components:
  - type: CartridgeAmmo
    # proto: BulletMagnumAP # Frontier
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#0a0a0a"

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: CartridgeMagnumUranium
  name: 子彈（.45馬格南鈾彈）
  parent: BaseCartridgeMagnum
  description: 一種主要用於轉輪手槍的重型馬格南子彈。鈾製彈藥將子彈的鉛芯替換為可裂變材料，從而從內部輻射目標。
  components:
  - type: CartridgeAmmo
    # proto: BulletMagnumUranium # Frontier
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#65fe08"
