- type: entity
  id: BaseCartridgeCaselessRifle
  name: 子彈（.25 步槍）
  parent: [ BaseCartridge, BaseC3SyndicateContrabandNoValue ] # Frontier: BaseSecurityContraband<BaseC3SyndicateContraband
  abstract: true
  components:
  - type: Tag
    tags:
      - Cartridge
      - CartridgeCaselessRifle
  - type: CartridgeAmmo
    deleteOnSpawn: true
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 1

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: CartridgeCaselessRifle
  name: 彈匣（.25 無殼彈）
  parent: BaseCartridgeCaselessRifle
  description: 一種採用無彈殼技術的小口徑彈藥，捨棄傳統黃銅彈殼，改用硬化推進劑。標準動能彈藥在大多數情況下都很常見且實用。
  components:
  - type: CartridgeAmmo
    # proto: BulletCaselessRifle # Frontier

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: CartridgeCaselessRiflePractice
  name: 子彈（.25 無殼練習彈）
  parent: BaseCartridgeCaselessRifle
  description: 一種採用無彈殼技術的小口徑彈藥，捨棄傳統的黃銅彈殼，改用硬化推進劑。粉筆彈通常無害，用於練習。
  components:
  - type: CartridgeAmmo
    # proto: BulletCaselessRiflePractice # Frontier
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#dbdbdb"

