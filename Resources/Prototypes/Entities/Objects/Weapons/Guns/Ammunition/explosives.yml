# region FRONTIER - IGNORED

# Rockets

- type: entity
  id: CartridgeRocket
  name: PG-7VL 手榴彈
  parent: [BaseItem] # Frontier: removed BaseMajorContraband
  description: 一款專為 RPG-7 火箭筒設計的 1.5 型彈頭。呈管狀。
  components:
  - type: Tag
    tags:
      - CartridgeRocket
  - type: Item
    size: Small
  - type: CartridgeAmmo
    # proto: BulletRocket # Frontier
    deleteOnSpawn: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    state: rpg
  - type: StaticPrice
    price: 20

- type: entity
  id: CartridgeRocketSlow
  name: PG-7VL 手榴彈「蝸牛火箭」
  parent: [BaseItem] # Frontier: removed BaseMajorContraband
  description: 一款專為 RPG-7 火箭筒設計的 1.5 型彈頭。其飛行速度異常緩慢。
  components:
    - type: Tag
      tags:
        - CartridgeRocket
    - type: Item
      size: Small
    - type: CartridgeAmmo
      # proto: BulletWeakRocket # Frontier
      deleteOnSpawn: true
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
      state: frag
    - type: StaticPrice
      price: 20

# Grenades

- type: entity
  id: BaseGrenade
  name: 基礎手榴彈
  parent: [BaseItem, BaseC2ContrabandUnredeemable] # Frontier: BaseMajorContraband<BaseC2ContrabandUnredeemable
  abstract: true
  components:
  - type: Tag
    tags:
    - Grenade
  - type: Item
    size: Small
  - type: Sprite

- type: entity
  id: GrenadeBaton
  name: 警棍型手榴彈
  parent: BaseGrenade
  components:
  - type: CartridgeAmmo
    # proto: BulletGrenadeBaton # Frontier
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: baton
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: baton
    suffix: false

- type: entity
  id: GrenadeBlast
  name: 爆破手榴彈
  parent: BaseGrenade
  components:
  - type: CartridgeAmmo
    # proto: BulletGrenadeBlast # Frontier
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: blast
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: blast
    suffix: false

- type: entity
  id: GrenadeFlash
  name: 閃光彈
  parent: BaseGrenade
  components:
  - type: CartridgeAmmo
    # proto: BulletGrenadeFlash # Frontier
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: flash
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: flash
    suffix: false

- type: entity
  id: GrenadeFrag
  name: 破片手榴彈
  parent: BaseGrenade
  components:
  - type: CartridgeAmmo
    # proto: BulletGrenadeFrag # Frontier
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: frag
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: frag
    suffix: false

- type: entity
  parent: BaseGrenade
  id: GrenadeCleanade
  name: 清潔手榴彈彈藥
  components:
  - type: CartridgeAmmo
    # proto: BulletGrenadeCleanade # Frontier
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: cleanade
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: frag
    suffix: false

- type: entity
  id: GrenadeEMP
  name: 電磁脈衝手榴彈
  parent: BaseGrenade
  components:
  - type: CartridgeAmmo
    # proto: BulletGrenadeEMP # Frontier
