# Empty mags
- type: entity
  id: BaseMagazineLightRifle
  name: "彈匣（.30口徑步槍）"
  parent: [ BaseItem, BaseC1Contraband, RecyclableItemSteelTiny ] # Frontier: BaseSecurityContraband<BaseC1Contraband added RecyclableItemSteelTiny
  abstract: true
  components:
  - type: Tag
    tags:
      - MagazineLightRifle
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeLightRifle
    # proto: CartridgeLightRifle # Frontier
    capacity: 30
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

# Magazines
- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: MagazineLightRifleBox
  name: "L6 SAW 彈匣盒（.30 步槍）"
  parent: BaseMagazineLightRifle
  description: 此彈匣內裝有 100 發連節式 .30 口徑步槍子彈，適用於 L6 等輕機槍。設計用途為裝載通用動能彈藥。
  components:
  - type: Tag
    tags:
      - MagazineLightRifleBox
  - type: BallisticAmmoProvider
    # proto: CartridgeLightRifle # Frontier
    capacity: 100
  - type: Item
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_box.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false
  - type: Appearance

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: MagazineLightRifle
  name: "magazine (.30 rifle)"
  parent: BaseMagazineLightRifle
  description: 適用於戰鬥步槍的彎曲型 30 發雙排彈匣。設計用於裝填通用動能彈藥。
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifle
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: MagazineLightRifleEmpty
  name: "彈匣（任何型號的.30口徑步槍）"
  suffix: empty
  parent: MagazineLightRifle
  description: 適用於戰鬥步槍的 30 發雙排曲面彈匣。
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: MagazineLightRiflePractice
  name: "彈匣（.30口徑步槍練習用）"
  parent: BaseMagazineLightRifle
  description: 適用於戰鬥步槍的彎曲型 30 發雙排彈匣。專為裝載無害的粉筆彈藥而設計。
  components:
  - type: BallisticAmmoProvider
    # proto: CartridgeLightRiflePractice # Frontier
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: stripe
      color: "#dbdbdb"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#dbdbdb"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#dbdbdb"

