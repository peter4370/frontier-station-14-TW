- type: entity
  id: BaseMagazineMagnum
  name: 手槍彈匣（.45馬格南）
  parent: [ BaseMagazinePistol, BaseC1Contraband, RecyclableItemSteelTiny ] # Frontier: BaseSecurityContraband<BaseC1Contraband, added RecyclableItemSteelTiny
  abstract: true
  components:
  - type: Tag
    tags:
      - MagazineMagnum
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeMagnum
    capacity: 7

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: MagazineMagnumEmpty
  name: 手槍彈匣（任何型號的 .45 馬格南）
  suffix: empty
  parent: BaseMagazineMagnum
  description: 7發單排手槍彈匣。
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: MagazineMagnum
  name: pistol magazine (.45 magnum)
  parent: BaseMagazineMagnum
  description: 7發單排彈匣。設計用於裝填通用動能彈藥。
  components:
  - type: BallisticAmmoProvider
    # proto: CartridgeMagnum # Frontier
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: MagazineMagnumPractice
  name: 手槍彈匣（.45馬格南練習用）
  parent: BaseMagazineMagnum
  description: 7發單排式手槍彈匣。專為裝填無害的粉筆彈藥而設計。
  components:
  - type: BallisticAmmoProvider
    # proto: CartridgeMagnumPractice # Frontier
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: stripe
      color: "#dbdbdb"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#dbdbdb"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#dbdbdb"

