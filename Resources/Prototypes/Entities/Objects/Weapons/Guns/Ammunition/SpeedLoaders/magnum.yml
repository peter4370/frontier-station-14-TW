- type: entity
  id: BaseSpeedLoaderMagnum
  name: "快速裝彈器（.45馬格南）"
  parent: [ BaseItem, BaseC1Contraband ] # Frontier: BaseSecurityContraband<BaseC1Contraband
  abstract: true
  components:
  - type: Tag
    tags:
      - SpeedLoaderMagnum
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgeMagnum
    capacity: 6
  - type: Sprite
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: SpeedLoaderMagnum
  name: "speed loader (.45 magnum)"
  parent: BaseSpeedLoaderMagnum
  description: 此設計旨在快速為空膛的轉輪手槍重新裝填子彈，最多可裝載六發子彈。專為裝載通用動能彈藥而設計。
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnum
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: base-6
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: base
    steps: 7
    zeroVisible: false
  - type: Appearance
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-ammo
      right:
      - state: inhand-right-mag
      - state: inhand-right-ammo

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: SpeedLoaderMagnumEmpty
  name: "快速裝彈器（任何型號的 .45 馬格南）"
  parent: SpeedLoaderMagnum
  description: 專為快速為空膛的左輪手槍裝彈而設計，可容納多達六發子彈，供你腰間那把「大鐵槍」使用。 #Big Iron reference (duh)
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      # TODO: This is actually a issue with all the speed loaders:
      #       You can mix different ammo types, but it will always
      #       use the one it was printed for.
      - state: base-6
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: SpeedLoaderMagnumIncendiary
  name: "快速裝彈器（.45馬格南燃燒彈）"
  parent: SpeedLoaderMagnum
  description: 此裝置專為快速為空的轉輪手槍裝填子彈而設計，最多可裝載六發子彈。其設計用途是裝載自燃式燃燒彈。
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumIncendiary

- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  id: SpeedLoaderMagnumPractice
  name: "快速裝彈器（.45馬格南練習用）"
  parent: BaseSpeedLoaderMagnum
  description: 此產品專為快速為空的轉輪手槍重新裝填而設計，最多可裝載六發子彈。旨在裝載無害的粉筆彈藥，非常適合用來練習快速拔槍。
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumPractice
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: practice-6
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: practice
    steps: 7
    zeroVisible: false
  - type: Appearance
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-ammo
      - state: inhand-left-stripe
        color: "#ea5800"
      right:
      - state: inhand-right-mag
      - state: inhand-right-ammo
      - state: inhand-right-stripe
        color: "#ea5800"

