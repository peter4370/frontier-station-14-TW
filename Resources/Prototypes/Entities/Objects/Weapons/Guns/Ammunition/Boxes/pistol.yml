- type: entity
  abstract: true
  parent: [BaseItem, RecyclableItemCardboard] # Frontier: added RecyclableItemCardboard
  id: BaseMagazineBoxPistol
  name: 彈藥箱（.35自動手槍）
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgePistol
    # proto: CartridgePistol # Frontier
    capacity: 60
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/pistol.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance

# Boxes
- type: entity
  categories: [ HideSpawnMenu ] # Frontier
  parent: BaseMagazineBoxPistol
  id: MagazineBoxPistol
  name: ammunition box (.35 auto)
  description: 一個裝有 .35 自動手槍子彈的紙箱。原定用於盛裝通用動能彈藥。
  components:
  - type: BallisticAmmoProvider
    # proto: CartridgePistol # Frontier
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

