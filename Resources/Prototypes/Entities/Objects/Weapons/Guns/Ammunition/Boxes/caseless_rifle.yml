- type: entity
  abstract: true
  parent: [BaseItem, RecyclableItemCardboard] # Frontier: added RecyclableItemCardboard
  id: BaseMagazineBoxCaselessRifle
  name: 彈藥箱（.25 無殼彈）
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeCaselessRifle
    # proto: CartridgeCaselessRifle # Frontier
    capacity: 60
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/caseless_rifle.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance

# Boxes
- type: entity
  abstract: true # Frontier: use NF ammo
  parent: BaseMagazineBoxCaselessRifle
  id: MagazineBoxCaselessRifle
  name: ammunition box (.25 caseless)
  description: 一個裝有 .25 無彈殼子彈的紙箱。原意是用來盛裝通用動能彈藥。
  components:
  - type: BallisticAmmoProvider
    # proto: CartridgeCaselessRifle # Frontier
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  abstract: true # Frontier: use NF ammo
  parent: BaseMagazineBoxCaselessRifle
  id: MagazineBoxCaselessRiflePractice
  name: 彈藥箱（.25 無殼練習彈）
  description: 一個裝有 .25 口徑無彈殼子彈的紙箱。原意是用來裝載無害的粉筆彈藥。
  components:
  - type: BallisticAmmoProvider
    # proto: CartridgeCaselessRiflePractice # Frontier
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: practice
