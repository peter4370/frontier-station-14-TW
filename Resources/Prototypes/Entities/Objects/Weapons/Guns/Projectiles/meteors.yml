- type: entity
  parent: BaseMeteor
  id: MeteorUrist
  name: 尤里斯·麥克梅特爾
  description: 身為社會中的一員，你擁有穩定且堅定不移的心理素質、無窮無盡的動力，以及與生俱來的金融天賦與掌控慾；你已被選中——不，你其實是被神聖（生物性）的創傷毫不費力地引導至此刻。 命運之門轟然敞開，而你再次佇立於那脈動的虛無之中。靈魂正承受著如閃光燈般閃爍的劇烈頭痛。
  suffix: Meteor
  components:
  - type: Sprite
    state: human_pixel
  - type: SolutionContainerManager
    solutions:
      blood:
        maxVol: 1000
        reagents:
        - ReagentId: Blood
          Quantity: 1000
  - type: Explosive
    totalIntensity: 25
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MaleScreams
          params:
            volume: 10
      - !type:SpillBehavior
        solution: blood
      - !type:SpawnEntitiesBehavior
        spawn:
          FoodMeatHuman:
            min: 1
            max: 2
      - !type:ExplodeBehavior

# Cow Meteor
- type: entity
