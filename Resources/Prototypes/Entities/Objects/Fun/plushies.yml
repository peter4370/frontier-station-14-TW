- type: entity
  parent: BasePlushie
  id: PlushieBee
  name: 蜜蜂絨毛玩偶
  description: 一個可愛的玩具，模樣活脫脫就像一個更可愛的程式設計師。除非是怪物，否則根本不會把它碾碎。
  components:
  - type: Sprite
    sprite: Objects/Fun/Plushies/bee.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: Objects/Fun/Plushies/bee.rsi
  - type: Extractable
    grindableSolutionName: bee
  - type: SolutionContainerManager
    solutions:
      bee:
        reagents:
        - ReagentId: GroundBee
          Quantity: 10
      food:
        maxVol: 10
        reagents:
        - ReagentId: GroundBee
          Quantity: 5
        - ReagentId: Fiber
          Quantity: 5
  - type: Clothing
    quickEquip: false
    sprite: Objects/Fun/Plushies/bee.rsi
    slots:
    - HEAD
  - type: FoodSequenceElement
    entries:
      CottonBurger: BeePlushie

