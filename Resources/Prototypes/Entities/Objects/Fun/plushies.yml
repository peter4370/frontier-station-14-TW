## Plushies

- type: entity
  abstract: true
  parent: [BaseItem, BaseStash]
  id: BasePlushie
  components:
  - type: EmitSoundOnUse
    sound: &BasePlushieSound
      collection: ToySqueak
      params:
        volume: -4
  - type: EmitSoundOnActivate
    sound: *BasePlushieSound
  - type: EmitSoundOnCollide
    sound: *BasePlushieSound
  - type: EmitSoundOnLand
    sound: *BasePlushieSound
  - type: EmitSoundOnTrigger
    sound: *BasePlushieSound
  - type: UseDelay
    delay: 1.0 # Frontier 3.0>1.0
  - type: MeleeWeapon
    # attackRate: 0.333 # Frontier
    wideAnimationRotation: 180
    soundHit: *BasePlushieSound
    damage:
      types:
        Blunt: 0
    hidden: true
  - type: PhysicalComposition
    materialComposition:
      Cloth: 100
  - type: StaticPrice
    price: 5
  - type: Edible
    requiresSpecialDigestion: true
    useSound: *BasePlushieSound
    delay: 2
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5 # Frontier: 10<5
        reagents:
        - ReagentId: Fiber
          Quantity: 5 # Frontier: 10<5
  - type: Tag
    tags:
    - Payload
    - ClothMade
  - type: MothFood # Frontier
  - type: NFPlushie # Frontier

- type: entity
  parent: BasePlushie
  id: PlushieThrongler
  name: throngler 絨毛玩偶
  description: 一隻絨毛玩偶，用來提醒貨運技術人員他們已無法擁有的東西。
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/ThronglerPlushie.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 10
  - type: Item
    size: Ginormous
    sprite: Objects/Weapons/Melee/Throngler-in-hand.rsi
  - type: FoodSequenceElement
    entries:
      CottonBurger: ThronglerPlushie


- type: entity
  parent: BasePlushie
  id: PlushieGhost
  name: ghost soft toy
  description: 打造屬於你的「GHOST GANG」！
  components:
  - type: Sprite
    sprite: Mobs/Ghosts/ghost_human.rsi
    state: icon
    noRot: true
  - type: Item
  - type: Physics
    angularDamping: 0.02
    linearDamping: 0.02
    fixedRotation: true
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.98
        friction: 0.01
  - type: TileFrictionModifier
    modifier: 0.1
  - type: RandomWalk
    accumulatorRatio: 0.5
    maxSpeed: 1
    minSpeed: 0.25
  - type: FoodSequenceElement
    entries:
      CottonBurger: GhostPlushie
  - type: Tag
    tags:
    - ForceableFollow
    - PlushieGhost
    - Payload
    - ClothMade

- type: entity
  parent: PlushieGhost
  id: PlushieGhostRevenant
  categories: [ DoNotMap ]
  name: '《亡魂》毛絨玩偶'
  description: 柔軟得讓人幾乎想小睡一會兒……
