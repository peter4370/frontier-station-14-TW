- type: entity
  parent: BikeHorn
  id: GoldenBikeHorn
  name: 金鵝
  categories: [ DoNotMap ]
  description: 一聲歡快的喇叭聲，就是獎品，祈求諸神賜予你獎賞吧。
  components:
  - type: Sprite
    sprite: Objects/Fun/goldbikehorn.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/goldbikehorn.rsi
    size: Tiny
  - type: Clothing
    sprite: Objects/Fun/goldbikehorn.rsi
    slots: [Belt]
  - type: Prayable
  - type: StaticPrice
    price: 1000
  - type: PointLight
    radius: 1.2
    energy: 2.2
    castShadows: false
    color: "#ffca1b"
  - type: NFTreasure # Frontier

