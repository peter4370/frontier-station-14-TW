- type: entity
  parent: BaseHandheldInstrument
  id: BaseBrassInstrument
  abstract: true
  components:
  - type: Tag
    tags:
    - BrassInstrument

- type: entity
  parent: BaseBrassInstrument
  id: TrumpetInstrument
  name: trumpet
  description: 爵士樂手和自以為是的中學生最愛的樂器。
  components:
  - type: Instrument
    program: 56
  - type: SwappableInstrument
    instrumentList:
      "Standard": {56: 0}
      "Muted": {59: 0}
  - type: Sprite
    sprite: Objects/Fun/Instruments/trumpet.rsi

- type: entity
  parent: BaseBrassInstrument
  id: TromboneInstrument
  name: 長號
  description: 人人都喜愛的滑閥式銅管樂器。
  components:
  - type: Instrument
    program: 57
  - type: Sprite
    sprite: Objects/Fun/Instruments/trombone.rsi

- type: entity
  parent: BaseBrassInstrument
  id: FrenchHornInstrument
  name: 法國號
  description: 既然拿著它時需要用手捂住，這或許能從中窺見其聲音的某些特徵。
  components:
  - type: Instrument
    program: 60
  - type: Sprite
    sprite: Objects/Fun/Instruments/frenchhorn.rsi

- type: entity
  parent: BaseBrassInstrument
  id: EuphoniumInstrument
  name: 上低音號
  description: 嬰兒大號？還是上低音號？不管是什麼，這堆管子看起來真是既酷又亂七八糟。
  components:
  - type: Instrument
    program: 3
    bank: 100 # Defined in space-station-14.sf2
  - type: Sprite
    sprite: Objects/Fun/Instruments/euphonium.rsi
