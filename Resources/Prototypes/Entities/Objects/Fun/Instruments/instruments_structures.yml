- type: entity
  name: 鋼琴
  parent: BasePlaceableInstrumentRotatable
  id: PianoInstrument
  description: 現在就來彈奏《Needles》鋼琴曲吧。
  components:
  - type: Instrument
    program: 1
  - type: Sprite
    state: piano
  - type: Climbable

- type: entity
  name: 直立式鋼琴
  parent: BasePlaceableInstrumentRotatable
  id: UprightPianoInstrument
  description: 我說的是皮安妮！
  components:
  - type: Instrument
    program: 3
  - type: Sprite
    state: piano-upright
  - type: Climbable

- type: entity
  name: 震音琴
  id: VibraphoneInstrument
  parent: BasePlaceableInstrumentRotatable
  description: 處處洋溢著愉悅的氛圍。
  components:
  - type: Instrument
    program: 11
  - type: Sprite
    state: vibraphone

- type: entity
  name: 馬林巴琴
  id: MarimbaInstrument
  parent: BasePlaceableInstrumentRotatable
  components:
  - type: Instrument
    program: 12
  - type: Sprite
    state: marimba

- type: entity
  name: 教堂管風琴
  parent: BasePlaceableInstrumentRotatable
  id: ChurchOrganInstrument
  description: 這東西真的糟透了！
  components:
  - type: Instrument
    program: 19
  - type: Sprite
    state: church-organ

- type: entity
  name: 大號
  parent: BasePlaceableInstrument
  id: TubaInstrument
  description: 銅管樂器的老大哥。站在這尊威嚴的樂器身旁，會讓人感到自慚形穢。
  components:
  - type: Instrument
    program: 58
  - type: Sprite
    state: tuba

- type: entity
  id: HarpInstrument
  parent: BasePlaceableInstrument
  name: 豎琴
  description: 撥動琴弦會割傷手指，但至少音樂很動聽。
  components:
  - type: Instrument
    program: 46
  - type: Sprite
    state: harp

- type: entity
  id: TimpaniInstrument
  parent: BasePlaceableInstrumentRotatable
  name: 定音鼓
  description: 它發出「砰砰砰砰」的聲響！
  components:
  - type: Instrument
    program: 47
  - type: Sprite
    state: timpani

- type: entity
  id: TaikoInstrument
  parent: BasePlaceableInstrumentRotatable
  name: 太鼓
  description: 一個大鼓。光是看著它，就讓人忍不住想拍打它。
  components:
  - type: Instrument
    program: 116
  - type: Sprite
    state: taiko

- type: entity
  id: ContrabassInstrument
  parent: BasePlaceableInstrument
  name: 低音提琴
  description: 非常適合打出一段優美的爵士節奏。
  components:
  - type: Instrument
    program: 43
  - type: Sprite
    state: contrabass
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 180
        mask:
        - Impassable
        - HighImpassable
        - MidImpassable
        layer:
        - Opaque
        - HighImpassable
        - MidImpassable
        - BulletImpassable

- type: entity
  name: minimoog
  parent: BasePlaceableInstrumentRotatable
  id: MinimoogInstrument
  description: 這是一台 Minimoog，就像一架太空鋼琴，但更具太空感！
  components:
  - type: Instrument
    program: 81
  - type: Sprite
    state: minimoog

- type: entity
  id: TomDrumsInstrument
  parent: BasePlaceableInstrumentRotatable
  name: 湯姆鼓
  description: 剩下的套件都去哪了？
  components:
  - type: Instrument
    program: 117
  - type: Sprite
    state: toms

- type: entity
  parent: [ BasePlaceableInstrumentRotatable, ConstructibleMachine]
  id: DawInstrument
  name: 數位音訊工作站
  description: 來自 90 年代的尖端音樂科技。
  components:
  - type: Sprite
    layers:
    - state: daw-base
    - state: daw-display
      shader: unshaded
    - state: daw-panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Appearance
  - type: WiresVisuals
  - type: WiresPanel
  - type: Machine
    board: DawInstrumentMachineCircuitboard
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
