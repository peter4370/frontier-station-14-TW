- type: entity
  parent: BaseHandheldInstrument
  id: BaseStringInstrument
  abstract: true
  components:
  - type: Tag
    tags:
    - StringInstrument

- type: entity
  parent: BaseStringInstrument
  id: BaseStringInstrumentClothing
  abstract: true
  components:
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage

- type: entity
  parent: BaseStringInstrumentClothing
  id: ElectricGuitarInstrument
  name: 電吉他
  description: 這下子，你簡直就像搖滾巨星一樣！
  components:
  - type: Instrument
    program: 27
  - type: SwappableInstrument
    instrumentList:
      "Clean": {27: 0}
      "Jazz": {26: 0}
      "Muted": {28: 0}
  - type: Sprite
    sprite: Objects/Fun/Instruments/eguitar.rsi

- type: entity
  parent: BaseStringInstrumentClothing
  id: BassGuitarInstrument
  name: 貝斯吉他
  description: 拿著這個，你會覺得自己超酷。可惜只有你這麼想。
  components:
  - type: Instrument
    program: 33
  - type: SwappableInstrument
    instrumentList:
      "Fingered": {33: 0}
      "Pick": {34: 0}
      "Slap": {36: 0}
      "Slap (XTra Funky)": {37: 0}
  - type: Sprite
    sprite: Objects/Fun/Instruments/bassguitar.rsi

- type: entity
  parent: BaseStringInstrumentClothing
  id: RockGuitarInstrument
  name: 搖滾吉他
  description: 這把斧頭真厲害！
  components:
  - type: Instrument
    program: 29
  - type: SwappableInstrument
    instrumentList:
      "Overdrive": {29: 0}
      "Distortion": {30: 0}
      "Harmonics": {31: 0}
  - type: Sprite
    sprite: Objects/Fun/Instruments/rockguitar.rsi
  - type: MeleeWeapon
    wideAnimationRotation: 45
    damage:
      types:
        Blunt: 6
        Slash: 2
  - type: Wieldable
  - type: IncreaseDamageOnWield #they don't call it an axe for nothing
    damage:
      types:
        Blunt: 4
        Slash: 2

- type: entity
  parent: BaseStringInstrumentClothing
  id: AcousticGuitarInstrument
  name: 原聲吉他
  description: 總之，這首是《Wonderwall》。
  components:
  - type: Instrument
    program: 24
  - type: SwappableInstrument
    instrumentList:
      "Nylon": {24: 0}
      "Steel": {25: 0}
  - type: Sprite
    sprite: Objects/Fun/Instruments/guitar.rsi
  - type: Wieldable
  - type: Damageable # Smash it! Does 20 damage a hit, but breaks after 1 hit.
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Weapons/guitarsmash.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 2
            max: 4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnHit # This makes it destroy after one hit.
    damage:
      types:
        Blunt: 20
  - type: MeleeWeapon
    wideAnimationRotation: 45
    damage:
      types:
        Blunt: 5
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 15

