- type: entity
  parent: BaseItem
  id: AppraisalTool
  name: 評估工具
  description: 這是會計人員的最佳夥伴，不僅與銀河市場有著量子連結，還能評估甚至是最棘手的物品。它還會告訴你，某個貨箱裡是否裝有已完成的懸賞目標。
  components:
  - type: Sprite
    sprite: Objects/Tools/appraisal-tool.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/appraisal-tool.rsi
    shape:
    - 0,0,1,0
    - 0,1,0,1
    storedOffset: -3,-3
  - type: PriceGun
  - type: UseDelay
    delay: 3
  - type: Clothing
    sprite: Objects/Tools/appraisal-tool.rsi
    quickEquip: false
    slots:
    - Belt
  - type: PhysicalComposition
    materialComposition:
      Steel: 250
  - type: Tag
    tags:
    - AppraisalTool
    - Sidearm
