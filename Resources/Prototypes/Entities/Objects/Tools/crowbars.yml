- type: entity
  name: crowbar
  parent: BaseItem
  id: BaseCrowbar
  abstract: true
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
  - type: Tag
    tags:
    - Crowbar
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 8
    soundHit:
      collection: MetalThud
  - type: Tool
    qualities:
      - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: ToolTileCompatible
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: StaticPrice
    price: 22
  - type: Prying
  - type: Sprite
    sprite: _NF/Objects/Tools/crowbar.rsi # Frontier: _NF prefix
  - type: Clothing
    sprite: _NF/Objects/Tools/crowbar.rsi # Frontier: _NF prefix
    quickEquip: false
    slots:
    - Belt
  - type: Item
    sprite: _NF/Objects/Tools/crowbar.rsi # Frontier: _NF prefix
    size: Normal
    shape:
    - 0,0,0,1

# Standard (grey) Crowbar
- type: entity
  parent: BaseCrowbar
  id: Crowbar
  description: 一款多功能工具，既可用於撬開門，也能對抗跨維度入侵者。
  components:
  - type: Sprite
    state: icon
  - type: Item
    storedSprite:
      sprite: _NF/Objects/Tools/crowbar.rsi # Frontier: _NF prefix
      state: storage

# Emergency (red) Crowbar
- type: entity
  name: 緊急撬棍
  parent: BaseCrowbar
  id: CrowbarRed
  description: 一款專為在停電時撬開門和防火鎖而設計的緊急撬棍。
  components:
  - type: Tag
    tags:
    - Crowbar
    - CrowbarRed
  - type: Sprite
    layers:
    - state: icon
    - state: cover-icon
      color: "#990000"
  - type: Item
    storedSprite:
      state: red-storage
      sprite: _NF/Objects/Tools/crowbar.rsi # Frontier: _NF prefix
    inhandVisuals:
      left:
      - state: inhand-left
      - state: cover-inhand-left
        color: "#990000"
      right:
      - state: inhand-right
      - state: cover-inhand-right
        color: "#990000"
  - type: Clothing
    clothingVisuals:
      belt:
      - state: equipped-BELT
      - state: cover-equipped-BELT
        color: "#990000"

