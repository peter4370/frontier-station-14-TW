- type: entity
  parent: [ DrinkBaseMaterialStrongPlastic, DrinkBase, DrinkVisualsFill ]
  id: Bucket
  name: bucket
  description: 這只是個老掉牙、無聊的桶子。
  components:
  - type: Edible
    utensil: Spoon
  - type: Sprite
    sprite: Objects/Tools/bucket.rsi
  - type: Item
    size: Normal
  - type: Clothing
    sprite: Objects/Tools/bucket.rsi
    slots:
    - HEAD
    quickEquip: false
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 250
  - type: SolutionTransfer
    transferAmount: 100
    maxTransferAmount: 100
    minTransferAmount: 10
  - type: SpillWhenWorn
    solution: drink
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    inHandsFillBaseName: null
  - type: Tag
    tags:
      - Bucket
  - type: DnaSubstanceTrace
  - type: TrashOnSolutionEmpty # Frontier
    solution: drink # Frontier
  - type: PhysicalComposition
    materialComposition:
      Plastic: 50

- type: entity
  parent: Bucket
  id: BorgBucket
  name: 內部水箱
  description: 一名清潔型機械人的內部儲水槽，容量足以容納整桶拖把水。
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 500
