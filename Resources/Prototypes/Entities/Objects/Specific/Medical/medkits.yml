- type: entity
  name: 急救箱
  description: 這是一款專為嚴重小傷勢準備的急救包。
  parent: BaseStorageItem
  id: Medkit
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Medical/firstaidkits.rsi # Frontier: _NF prefix
    state: firstaid
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,1
  - type: Item
    size: Normal # Frontier: Large<Normal
    shape: # Frontier
    - 0,0,3,1 # Frontier
    sprite: _NF/Objects/Specific/Medical/firstaidkits.rsi # Frontier: _NF prefix
    heldPrefix: firstaid
  - type: PhysicalComposition
    materialComposition:
      Plastic: 150
  - type: Tag
    tags:
    - Medkit

