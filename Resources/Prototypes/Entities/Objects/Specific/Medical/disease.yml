- type: entity
  parent: [BaseItem, RecyclableItemPlasticTiny] # Frontier: added RecyclableItemPlasticTiny
  id: DiseaseSwab
  name: 無菌棉籤
  description: 用於採集及轉移樣本。開封前保持無菌。僅限一次性使用。
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Specific/Medical/mouth_swab.rsi
    state: icon
  - type: Tag
    tags:
    - Recyclable
    - Trash
  - type: BotanySwab
  - type: GuideHelp
    guides:
  # - Virology (when it's back)
    - Botany
    - Chemicals

- type: entity
  parent: [BaseAmmoProvider, RecyclableItemCardboard] # this is for cycling swabs out and not spawning 30 entities, trust # Frontier: added RecyclableItemCardboard
  id: BoxMouthSwab
  name: 無菌棉籤分配器
  description: 可取出 30 支無菌棉籤，對植物學研究極為實用。
  components:
  - type: Sprite
    layers:
    - state: boxwide
    - state: swab
  - type: BallisticAmmoProvider
    whitelist:
      components:
      - BotanySwab
    proto: DiseaseSwab
    capacity: 30
  - type: GuideHelp
    guides:
  # - Virology (when it's back)
    - Botany
    - Chemicals

- type: entity
  parent: BaseItem
  id: Vaccine
  name: 疫苗
  description: 防止尚未罹患該疾病的人感染該疾病。
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    state: salpen
