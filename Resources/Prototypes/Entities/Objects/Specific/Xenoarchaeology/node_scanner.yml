- type: entity
  parent: BaseItem
  id: NodeScanner
  name: 節點掃描器
  description: 這位考古學家的朋友，僅憑一次掃描就能辨識出文物中的節點。
  components:
    - type: Sprite
      sprite: Objects/Specific/Xenoarchaeology/node_scanner.rsi
      state: icon
    - type: Item
      sprite: Objects/Specific/Xenoarchaeology/node_scanner.rsi
    - type: NodeScanner
    - type: UseDelay
      delay: 1
    - type: GuideHelp
      guides:
      - ArtifactReports
    - type: ActivatableUI
      key: enum.NodeScannerUiKey.Key
      singleUser: true
    - type: UserInterface #needs to be here for certain effects
      interfaces:
        enum.NodeScannerUiKey.Key:
          type: NodeScannerBoundUserInterface
