- type: entity
  parent: [ BaseStorageItem, BaseXenoborgContraband ]
  id: MaterialBag
  name: 物料袋
  description: 一款結實耐用的背包，供外星博格人攜帶大量物料使用。
  components:
  - type: MagnetPickup
  - type: Sprite
    sprite: Objects/Specific/Mining/ore_bag.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Specific/Mining/ore_bag.rsi
    quickEquip: false
    slots:
    - belt
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,9,3
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: Dumpable
