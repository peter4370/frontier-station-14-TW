- type: entity
  parent: BaseMech
  id: MechVim
  name: Vim
  description: 由 Nanotrasen 研發的一款微型外骨骼裝，旨在讓空間站裡那些無可取代的寵物多活一陣子。
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: Objects/Specific/Mech/mecha.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base" ]
      state: vim
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.15
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Effects/Footsteps/borgwalk1.ogg # Frontier: Mecha/mechmove03 > /Footsteps/borgwalk1.ogg
      params:
        volume: -5 # Frontier: Louder due to change in sound effect
  - type: Mech
    baseState: vim
    openState: vim-open
    brokenState: vim-broken
    maxEquipmentAmount: 2 # Frontier 0<2
    # keep mouse safe
    mechToPilotDamageMultiplier: 0.1
    airtight: true
    equipmentWhitelist: # Frontier
      tags: # Frontier
      - SmallMech # Frontier
    pilotWhitelist:
      tags:
      - VimPilot
  - type: MeleeWeapon
    hidden: true
    attackRate: 0.8
    damage:
      types:
        Blunt: 10 #thwack
        Structural: 2
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.25
    baseSprintSpeed: 3.6
  - type: Access
    groups: # Frontier: contractor access
    - GeneralAccess # Frontier
    # tags: # Frontier
    # - Maintenance # Frontier
  # TOOD: buzz / chime actions
  # TODO: builtin flashlight

- type: entity
  parent: MechVim
  id: MechVimBattery
  suffix: Battery
  components:
  - type: ContainerFill
    containers:
      mech-battery-slot:
      - PowerCellHigh
