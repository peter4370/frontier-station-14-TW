- type: entity
  name: 垃圾袋
  id: TrashBag
  parent: [BaseStorageItem, RecyclableItemPlasticSmall] # Frontier: added RecyclableItemPlasticSmall
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/trashbag.rsi
    layers:
      - state: icon-0
        map: ["enum.StorageFillLayers.Fill"]
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,7,5
    quickInsert: true
    areaInsert: true
    storageOpenSound:
      collection: trashBagRustle
    storageInsertSound:
      collection: trashBagRustle
    whitelist:
      tags:
        - Cartridge
        - Trash
      components: # Frontier: added GoblinMade
        - GoblinMade # Frontier: added GoblinMade
  - type: UseDelay
    delay: 0.5
  - type: Tag
    tags:
    - TrashBag
  - type: Appearance
  - type: StorageFillVisualizer
    maxFillLevels: 4
    fillBaseName: icon
  - type: Dumpable
  - type: Clothing
    slots: [belt]
    sprite: Objects/Specific/Janitorial/trashbag.rsi
  - type: Item
    size: Normal
  - type: MagnetPickup # Frontier
    magnetEnabled: false # Frontier
  - type: GoblinPreciousTrashBag # Frontier

- type: entity
  name: trash bag
  id: TrashBagBlue
  parent: TrashBag
  components:
  - type: Sprite
    layers:
      - state: blue-icon-0
        map: ["enum.StorageFillLayers.Fill"]
  - type: Item
    heldPrefix: blue
  - type: StorageFillVisualizer
    fillBaseName: blue-icon

- type: entity
  name: 那股令人無法自拔的潔淨魔力
  id: BagOfSummoningGarbage
  parent: TrashBagBlue
  components:
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,19,9
    quickInsert: true
    areaInsert: true
    areaInsertRadius: 5

- type: entity
  parent: TrashBag
  id: BorgTrashBag
  name: 內層垃圾袋
  description: 一款升級版垃圾袋，內部容量更大，可直接安裝於清潔機器人內。
  components:
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,6
