- type: entity
  name: 礦石收納袋
  id: OreBagOfHolding
  parent: OreBag
  description: 一款堅固的收納袋，無論是打撈億萬富翁還是富裕的礦工，都能用來攜帶大量礦石。當繫在腰帶上時，會使附近的礦石磁化。
  components:
  - type: MagnetPickup
    range: 2
  # Frontier: layered sprite
  - type: Sprite
    sprite: _NF/Objects/Specific/Mining/ore_bag_holding.rsi
    layers:
    - state: icon
    - state: icon-on
      visible: false
      map: [ "enum.ToggleableVisuals.Layer" ]
    - state: icon-unlit
      shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  # End Frontier: sprite revisions
  - type: Clothing
    sprite: _NF/Objects/Specific/Mining/ore_bag_holding.rsi # Frontier
  - type: Storage
    grid:
    - 0,0,19,9
  # Frontier: item visuals
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      - state: inhand-left-unlit
        shader: unshaded
      right:
      - state: inhand-right
      - state: inhand-right-unlit
        shader: unshaded
  # End Frontier
