- type: entity
  parent: BaseItem
  id: BaseVendingMachineRestock
  abstract: true
  name: 自動販賣機補貨箱
  description: 一個用於為自動販賣機補充公司禮品的箱子。
  components:
  - type: VendingMachineRestock
  - type: Sprite
    sprite: Objects/Specific/Service/vending_machine_restock.rsi
    layers:
    - state: base
    - state: green_bit
      shader: unshaded
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 5
    soundHit:
      path: /Audio/Weapons/genhit2.ogg
    soundSwing:
      path: /Audio/Weapons/punchmiss.ogg
  - type: Item
    size: Normal
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
#      - !type:DumpRestockInventory # Frontier
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice # Frontier
    price: 400 # Frontier

