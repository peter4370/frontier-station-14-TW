- type: entity
  name: 迷你鋤頭
  parent: BaseItem
  id: HydroponicsToolMiniHoe
  description: 它用來除草或搔背。
  components:
  - type: Tag
    tags:
    - Hoe
    - BotanyHoe
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/hoe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    damage:
      types:
        Slash: 6
  - type: Item
    sprite: Objects/Tools/Hydroponics/hoe.rsi
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  name: 修枝剪
  parent: BaseItem
  id: HydroponicsToolClippers
  description: 一種用於從植物中採集樣本的工具。
  components:
  - type: Tag
    tags:
    - PlantSampleTaker
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/clippers.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 90
    damage:
      types:
        Slash: 7
  - type: Item
    sprite: Objects/Tools/Hydroponics/clippers.rsi
    storedRotation: -90
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  name: 鐮刀
  parent: BaseItem
  id: HydroponicsToolScythe
  description: 這件工具配備了一把鋒利且彎曲的刀刃，握柄則採用長型纖維金屬材質，讓您能輕鬆收穫親手播下的種子。
  components:
  - type: Sharp
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/scythe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    damage:
      types:
        Slash: 10
  - type: Item
    size: Normal
  - type: Clothing
    sprite: Objects/Tools/Hydroponics/scythe.rsi
    slots:
    - back
  - type: StaticPrice
    price: 40
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Plastic: 100

- type: entity
  name: 斧頭
  parent: BaseItem
  id: HydroponicsToolHatchet
  description: 一把鋒利無比的斧頭，配有短小的纖維金屬斧柄。它擁有悠久的劈砍歷史，但如今主要用於劈柴。
  components:
  - type: Tag
    tags:
    - BotanyHatchet
  - type: Sharp
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/hatchet.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    damage:
      types:
        Slash: 8
        Piercing: 2
  - type: Item
    sprite: Objects/Tools/Hydroponics/hatchet.rsi
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  name: 鏟子
  parent: BaseItem
  id: HydroponicsToolSpade
  description: 一種用於挖掘和搬運泥土的小型工具。
  components:
  - type: Tag
    tags:
    - BotanyShovel
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/spade.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 45
    damage:
      types:
        Blunt: 8
        Piercing: 2 # I guess you can stab it into them?
    soundHit:
      collection: MetalThud
  - type: Item
    sprite: Objects/Tools/Hydroponics/spade.rsi
  - type: Shovel
    speedModifier: 0.75 # slower at digging than a full-sized shovel
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  name: 植物袋
  id: PlantBag
  parent: NFBaseClothingBeltStorageBag # Frontier: BaseStorageItem<NFBaseClothingBeltStorageBag
  description: 一款專為植物學家設計的袋子，方便他們搬運大量採集的植物標本。
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/Equipment/plant_bag.rsi
    # Frontier: layered sprite
    layers:
    - state: icon
    - state: icon-on
      visible: False
      map: [ "enum.ToggleableVisuals.Layer" ]
    # End Frontier
  - type: Item
    storedRotation: -90
    size: Ginormous # Frontier
  - type: Clothing
    quickEquip: false
    slots:
    - belt
  - type: Storage
    grid:
    - 0,0,7,4
    maxItemSize: Small
    quickInsert: true
    areaInsert: true
    whitelist:
      components:
        - Produce
        - Seed
  - type: Dumpable
  - type: MagnetPickup # Frontier
    magnetEnabled: false # Frontier
    magnetCanBeEnabled: false # Frontier
  - type: NFPlantBag # Frontier
  # Begin DeltaV Additions: toggle magnet from White Dream
  - type: ItemToggle
    soundActivate: &soundActivate
      collection: sparks
      params:
        variation: 0.25
    soundDeactivate: *soundActivate
    onUse: false # Frontier
    onAltUse: true # Frontier
    onActivate: false # Frontier
  - type: ItemToggleExamine
    on: item-toggle-examine-magnet-on
    off: item-toggle-examine-magnet-off
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled: # Frontier: Enum changes from Wizden#35341
        enum.ToggleableVisuals.Layer: # Frontier: Enum changes from Wizden#35341
          True: { visible: True }
          False: { visible: False }
  # End DeltaV Additions
