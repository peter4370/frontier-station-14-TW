- type: entity
  parent: BaseItem
  id: ResearchDisk
  name: 研究點磁碟 (1000)
  description: 一張用於研發伺服器的磁碟，內含 1000 個資料點。
  components:
  - type: Sprite
    sprite: Objects/Specific/Research/researchdisk.rsi
    state: icon
  - type: ResearchDisk
  - type: GuideHelp
    guides:
    - Science
  - type: StaticPrice # Frontier
    price: 200 # Frontier

- type: entity
  parent: ResearchDisk
  id: ResearchDisk5000
  name: 研究點數 (5000)
  description: 一張存有 5000 個資料點的 R&D 伺服器專用光碟。
  components:
  - type: ResearchDisk
    points: 5000
  - type: StaticPrice # Frontier
    price: 1000 # Frontier

- type: entity
  parent: ResearchDisk
  id: ResearchDisk10000
  name: 研究點數 (10000)
  description: 一張用於研發伺服器的磁碟，內含 10,000 個資料點。
  components:
  - type: ResearchDisk
    points: 10000
  - type: StaticPrice # Frontier
    price: 2000 # Frontier

- type: entity
  parent: ResearchDisk
  id: ResearchDiskDebug
  name: 研究點磁碟
  suffix: DEBUG, DO NOT MAP
  categories: [ DoNotMap ]
  description: 一張專供研發伺服器使用的光碟，其中收錄了您可能需要的所有資料點。
  components:
  - type: ResearchDisk
    unlockAllTech: true

- type: entity
  parent: BaseItem
  id: TechnologyDisk
  name: technology disk
  description: 一張存有研究技術的磁碟，供研發伺服器使用。
  categories: [ HideSpawnMenu ] # Frontier: no tech disks
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: datadisk_base
      map: ["enum.DamageStateVisualLayers.Base"]
    - state: datadisk_label
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        datadisk_base: Sixteen
  - type: TechnologyDisk
    tierWeightPrototype: TechDiskTierWeights # Frontier
  - type: StaticPrice
    price: 0.01 # Frontier 100<0.01 - research points are a means to an end, not an end of their own
  - type: StealTarget
    stealGroup: TechnologyDisk
  - type: PirateBountyItem # Frontier
    id: TechnologyDisk # Frontier

- type: entity
  parent: TechnologyDisk
  id: TechnologyDiskRare
  suffix: rare.
  categories: [ HideSpawnMenu ] # Frontier: no tech disks
  components:
  - type: TechnologyDisk
    tierWeightPrototype: RareTechDiskTierWeights
