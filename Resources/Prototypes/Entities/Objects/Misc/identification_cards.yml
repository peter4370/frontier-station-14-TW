- type: entity
  parent: Clothing
  id: IDCardStandard
  name: 身分證
  description: 一張用於進入太空站內各個區域的通行卡。
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Misc/id_cards.rsi
  - type: Clothing
    slots:
    - idcard
    sprite: Objects/Misc/id_cards.rsi
  - type: Item
    size: Small
    heldPrefix: default
    storedRotation: -90
  - type: Access
  - type: IdCard
  - type: StationRecordKeyStorage
  - type: Tag
    tags:
    - DoorBumpOpener
    - WhitelistChameleon
    - WhitelistChameleonIdCard
  - type: StealTarget
    stealGroup: IDCard
  - type: StaticPrice # Frontier
    price: 5 # Frontier The card need to cost less then the PDA that comes with a card and a pen in it.
  - type: CargoSellBlacklist # Frontier
  - type: ShipyardSellCondition # Frontier: Teleport to shipyard console on sale
    preserveOnSale: true

