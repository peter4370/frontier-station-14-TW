- type: entity
  name: 承包商身分證 # Frontier: passenger<contractor
  parent: [IDCardStandard, BaseChameleon, BaseC3SyndicateContraband] # Frontier: Add BaseC3SyndicateContraband
  id: AgentIDCard
  suffix: Agent
  components:
  - type: PresetIdCard
    job: Contractor # Frontier: Passenger<Contractor
  - type: Access
    tags:
    - Maintenance
    - SyndicateAgent
  - type: Sprite
    layers:
    - state: default
    - state: idcontractor # Frontier: idpassenger<idcontractor
      sprite: _NF/Objects/Misc/id_cards.rsi # Frontier
  - type: AgentIDCard
  - type: UIRequiresLock
  - type: ActivatableUI
    key: enum.AgentIDCardUiKey.Key
    inHandsOnly: true
    verbText: agent-id-open-ui-verb
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: ChameleonClothing
    slot: [idcard]
    default: ContractorIDCard # Frontier: PassengerIDCard<ContractorIDCard
    requireTag: WhitelistChameleonIdCard
  - type: UserInterface
    interfaces:
      enum.AgentIDCardUiKey.Key:
        type: AgentIDCardBoundUserInterface
      enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface
  - type: Contraband # Frontier
    hideValues: true # Frontier

