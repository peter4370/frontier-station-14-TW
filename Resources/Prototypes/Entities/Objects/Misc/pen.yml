- type: entity
  name: 筆
  parent: BaseItem
  id: Pen
  description: 一支深色墨水筆。
  components:
  - type: Sprite
    sprite: Objects/Misc/pens.rsi
    state: pen
  - type: Item
    sprite: Objects/Misc/pens.rsi
    heldPrefix: pen
    size: Tiny
  - type: Tag
    tags:
    - Write
    - Pen
  - type: PhysicalComposition
    materialComposition:
      Steel: 25
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Items/pen_click.ogg
      params:
        volume: -4
        maxDistance: 2
  - type: UseDelay
    delays: # Frontier
      stamp: # Frontier
        length: 1.0 # Frontier: 1 second between stampings, avoid spam for reapplied stamps
    delay: 1.5
  - type: Stamp # Frontier
    stampedColor: "#333333" # Frontier
    stampState: "paper_stamp-nf-signature" # Frontier
    sound: # Frontier
      path: /Audio/Items/Paper/paper_scribble1.ogg # Frontier
      params: # Frontier
        volume: -2 # Frontier
        maxDistance: 5 # Frontier

- type: entity
  parent: Pen
  id: PenEmbeddable
  abstract: true
  components:
  - type: EmbeddableProjectile
    offset: 0.3,0.0
    removalTime: 0.0
  - type: ThrowingAngle
    angle: 315
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 3
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.3,0.1
          - -0.1,0.3
          - 0.3,-0.1
          - 0.1,-0.3
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2

#TODO: I want the luxury pen to write a cool font like Merriweather in the future.

- type: entity
  name: 名牌鋼筆
  parent: Pen
  id: LuxuryPen
  description: 一支精緻且昂貴的鋼筆，唯有當你具備處理大量文書工作的資格時，才配擁有它。
  components:
  - type: Sprite
    state: luxury_pen
  - type: Item
    heldPrefix: luxury_pen

- type: entity
  id: BaseAdvancedPen
  parent: PenEmbeddable
  abstract: true
  components:
  - type: Tag
    tags:
    - Write
    - WriteIgnoreStamps
    - Pickaxe
    - Pen
  - type: MeleeWeapon
    wideAnimationRotation: -45
    damage:
      types:
        Piercing: 15
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Tool
    qualities:
    - Screwing
    useSound:
      collection: Screwdriver

- type: entity
  name: Cybersun 鋼筆
  # parent: [BaseAdvancedPen, BaseC3SyndicateContraband] # Frontier
  parent: [NFBaseUnprotectedAdvancedPen, BaseC3SyndicateContraband] # Frontier
  id: CyberPen
  description: 這支來自 Cybersun 法務部門的高科技鋼筆，能透過其鑽石筆尖以難以置信的角度折射「硬光」來書寫。其威力之強，甚至能在必要時重寫已加蓋官方印章的文件。
  components:
  - type: Sprite
    state: overpriced_pen
  - type: Item
    heldPrefix: overpriced_pen
  - type: StaticPrice
    price: 500

- type: entity
  name: CentComm 鋼筆
  parent: [BaseAdvancedPen, BaseCentcommCommandContraband] # Frontier: Added BaseCentcommCommandContraband, removed BaseCentcommContraband.
  id: PenCentcom
  description: 為了跟上「賽博太陽」官僚體系的「勢力」，NT 依照其企業風格，製作了一支仿製的賽博筆。
  components:
  - type: Sprite
    state: pen_centcom
  - type: Item
    heldPrefix: pen_centcom

- type: entity
  name: captain's fountain pen
  parent: PenEmbeddable
  id: PenCap
  description: 一支專為站長準備的豪華鋼筆。
  components:
  - type: Sprite
    state: pen_cap

- type: entity
  name: hop's fountain pen
  parent: PenEmbeddable
  id: PenHop
  description: 一支專為車站候車區打造的奢華鋼筆。
  components:
  - type: Sprite
    state: pen_hop

- type: entity
  name: 巫師的魔法筆
  parent: [ PenEmbeddable, BaseC3WizardContraband ] # Frontier: BaseMagicalContraband<BaseC3WizardContraband
  id: PenWiz
  description: 一支奢華的鋼筆。似乎配有一塊神奇的水晶橡皮擦。
  components:
  - type: Sprite
    state: pen_wizard
  - type: Tag
    tags:
    - NFWriteIgnoreUnprotectedStamps # WriteIgnoreStamps<NFWriteIgnoreUnprotectedStamps
    - Write
    - Pen
