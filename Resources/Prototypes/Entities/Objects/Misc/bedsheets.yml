- type: entity
  id: BedsheetCaptain
  parent: BedsheetBase
  name: 船長床單
  description: 上面印有 Nanotrasen 的標誌，並採用了一種革命性的新型紗線編織而成，保證對大多數非化學物質的滲透率僅為 0.01%，深受多數現代船長青睞。
  components:
  - type: Sprite
    state: sheetcaptain
  - type: Clothing
    sprite: Clothing/Neck/Bedsheets/captain.rsi
  - type: StealTarget
    stealGroup: HeadBedsheet

- type: entity
