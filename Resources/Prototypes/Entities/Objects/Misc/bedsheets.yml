- type: entity
  parent: [BaseItem, RecyclableItemClothSmall] # Frontier: added RecyclableItemClothSmall
  id: BedsheetBase
  name: BedsheetBase
  abstract: true
  description: 一款出乎意料地柔軟的亞麻床單。
  placement:
    mode: SnapgridCenter
    snap:
    - Bed
  components:
  - type: Sprite
    sprite: Objects/Misc/bedsheets.rsi
    noRot: true
  - type: Item
    size: Small
  - type: Clothing
    quickEquip: true
    slots:
    - neck
  - type: StaticPrice
    price: 100
  - type: Tag
    tags:
    - Bedsheet

- type: entity
  id: BedsheetBlack
  parent: BedsheetBase
  name: 黑色床單
  components:
  - type: Sprite
    state: sheetblack
  - type: Clothing
    sprite: Clothing/Neck/Bedsheets/black.rsi

