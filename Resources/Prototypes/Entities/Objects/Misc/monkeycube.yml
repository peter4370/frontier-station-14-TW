- type: entity
  parent: BoxCardboard
  name: 猴子魔方盒
  id: MonkeyCubeBox
  description: Drymate 品牌的猴子方塊。只要加水即可！
  components:
  - type: StorageFill
    contents:
      - id: MonkeyCubeWrapped
        amount: 8
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box
  - type: StaticPrice
    price: 20
    vendPrice: 960 # Frontier - 120 per monkey (meat worth 540 at a depot)

- type: entity
  parent: BaseItem
  abstract: true
  suffix: Wrapped
  id: BaseWrappedCube
  components:
  - type: Item
    size: Tiny
  - type: SpawnItemsOnUse
    sound:
      path: /Audio/Effects/unwrap.ogg
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi

- type: entity
  parent: BaseWrappedCube
  name: 猴子方塊
  id: MonkeyCubeWrapped
  description: 拆開這個包裝，就能得到一個猴子魔方。
  components:
  - type: SpawnItemsOnUse
    items:
    - id: MonkeyCube
  - type: Sprite
    state: wrapper
  - type: Tag
    tags:
    - MonkeyCube
  - type: StaticPrice
    price: 55 # The same price as dead (-20)

- type: entity
  parent: MonkeyCubeBox
  name: 科博爾德立方體盒子
  id: KoboldCubeBox
  description: 濃縮的科博爾德裝在立方體裡。只要加水即可！
  components:
  - type: StorageFill
    contents:
      - id: KoboldCubeWrapped
        amount: 8
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box_kobold
  - type: StaticPrice # Frontier
    vendPrice: 640 # Frontier - 80 per kobold (meat worth 360 at a depot)

- type: entity
  parent: MonkeyCubeBox
  name: 變體魔方盒
  id: VariantCubeBox
  description: 既有小妖魔方塊，也有猴子方塊。只要加點水就行！
  components:
  - type: StorageFill
    contents:
      - id: KoboldCubeWrapped
        amount: 4
      - id: MonkeyCubeWrapped
        amount: 4
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box_variant
  - type: StaticPrice
    price: 20
    vendPrice: 800 # Frontier - 120 per monkey, 80 per kobold (meat worth 450 at a depot)

- type: entity
  parent: BaseWrappedCube
  name: 科博爾德方塊
  id: KoboldCubeWrapped
  description: 拆開這個包裝，即可獲得一個哥布林魔方。
  components:
  - type: SpawnItemsOnUse
    items:
      - id: KoboldCube
  - type: Sprite
    state: wrapper_kobold

- type: entity
  parent: MonkeyCubeBox
  name: monkey cube box
  suffix: Syndicate
  id: SyndicateSpongeBox
  description: Drymate brand monkey cubes. Just add water!
  components:
  - type: StorageFill
    contents:
      - id: SyndicateSpongeWrapped
        amount: 6
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box

- type: entity
  parent: MonkeyCubeWrapped
  name: monkey cube
  suffix: Wrapped, Syndicate
  id: SyndicateSpongeWrapped
  components:
  - type: SpawnItemsOnUse
    items:
      - id: SyndicateSponge
