- type: entity
  parent: BaseItem
  id: TreasureCoinIron
  name: 硬幣
  description: 一片扁平的金屬片。倘若它仍在流通，通膨早就讓它一文不值了。既然它已經不再流通，那它的價值就足以讓人把它收在書裡。
  components:
  - type: Sprite
    sprite: Objects/Misc/coins.rsi
    state: coin_iron
  - type: Item
    size: Tiny
  - type: StackPrice # Frontier: Static<Stack
    price: 75
  - type: Stack # Frontier
    stackType: TreasureCoinIron # Frontier
    count: 1 # Frontier
  - type: NFCoin # Frontier: relying on inheritance for other coins.

