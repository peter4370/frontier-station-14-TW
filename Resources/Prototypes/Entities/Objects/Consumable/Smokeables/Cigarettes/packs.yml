- type: entity
  id: CigPackSyndicate
  parent: [CigPackBase, BaseC3SyndicateContrabandNoValue] # Frontier: BaseSyndicateContraband<BaseC3SyndicateContraband
  name: Interdyne 草本茶包
  description: 專為精英集團特工打造的頂級香菸。內含藥劑，當您需要的不僅是平復神經時，它能派上用場。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/Packs/syndicate.rsi
  - type: Item
    sprite: Objects/Consumable/Smokeables/Cigarettes/Packs/syndicate.rsi
  - type: StorageFill
    contents:
    - id: CigaretteSyndicate
      amount: 10

- type: entity
  id: CigPackMixed
  parent: CigPackMixedBase
  name: Dan's soaked smokes
  suffix: Mixed
  description: 丹與 NT 化學部門合作，處理了多餘的化學品，祝您愉快。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/Packs/mixed.rsi
  - type: Item
    sprite: Objects/Consumable/Smokeables/Cigarettes/Packs/mixed.rsi
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 2, 9
        tableId: RandomSoakedSmokeTable

