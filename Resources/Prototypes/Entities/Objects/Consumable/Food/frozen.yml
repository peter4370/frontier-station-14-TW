    - cold # Frontier
    - berry # Frontier

- type: entity
  name: 水果沙拉刨冰
  parent: FoodFrozenSnowconeBase
  id: FoodFrozenSnowconeFruit
  description: 將各種柑橘風味糖漿調和成令人愉悅的混合風味，淋在紙杯裡的「雪球」上。
