    - funny # Frontier

- type: entity
  name: mime 刨冰
  parent: FoodFrozenSnowconeBase
  id: FoodFrozenSnowconeMime
  description: ...
  components:
  - type: Sprite
    layers:
    - state: cone
    - state: mime
  - type: Edible
    trash:
    - FoodFrozenSnowconeTrash
  - type: FlavorProfile # Frontier: add flavour profile
    flavors: # Frontier
