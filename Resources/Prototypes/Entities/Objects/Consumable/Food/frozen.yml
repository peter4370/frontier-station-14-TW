    - silence # Frontier

- type: entity
  name: 彩虹刨冰
  parent: FoodFrozenSnowconeBase
  id: FoodFrozenSnowconeRainbow
  description: 一個裝在紙杯裡的、色彩繽紛的雪球。
  components:
  - type: Sprite
    layers:
    - state: cone
    - state: rainbow
  - type: Edible
    trash:
    - FoodFrozenSnowconeTrash
  # Frontier: flavors, custom fill
  - type: FlavorProfile
    flavors:
    - sweet
    - cold
    - magical
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
          - ReagentId: SpaceDrugs
            Quantity: 4
          - ReagentId: MindbreakerToxin
            Quantity: 2.5
          - ReagentId: Happiness
            Quantity: 2.5
          - ReagentId: Psicodine
            Quantity: 1
          - ReagentId: Sugar
            Quantity: 2
  # End Frontier: flavors, custom fill

# Trash

- type: entity
  parent: BaseItem
  id: FoodFrozenSnowconeTrash
  name: 紙錐
  description: 一個用來裝冰涼點心的皺巴巴紙錐。毫無價值。
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Consumable/Food/frozen.rsi
    state: cone-trash
  - type: Tag
    tags:
    - Trash
  - type: GoblinPreciousTrash # Frontier

- type: entity
  name: 冰棒棍
  parent: BaseItem
  id: FoodFrozenPopsicleTrash
  description: 曾經盛裝著美味的點心。如今，卻已空空如也。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/frozen.rsi
    layers:
      - state: stick
        map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          stick: ""
          stick2: ""
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage
  - type: GoblinPreciousTrash # Frontier
