# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_snack.yml
# Base

- type: entity
  parent: FoodInjectableBase
  id: FoodFrozenBase
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/frozen.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20 # For sprinkles or something? Idk.
        reagents:
        - ReagentId: Nutriment
          Quantity: 10

# Ice-cream

- type: entity
  parent: FoodFrozenBase
  id: FoodFrozenSandwich
  name: 冰淇淋三明治
  description: 附有獨立包裝的便攜式冰淇淋。
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    state: sandwich
  - type: FlavorProfile # Frontier: add flavour profile
    flavors: # Frontier
    - sweet # Frontier
    - icecream # Frontier

- type: entity
  parent: FoodFrozenBase
  id: FoodFrozenSandwichStrawberry
  name: 草莓冰淇淋三明治
  description: 草莓口味的便攜式冰淇淋，附有獨立包裝。
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    state: sandwich-strawberry
  - type: FlavorProfile # Frontier: add flavour profile
    flavors: # Frontier
    - sweet # Frontier
    - berry # Frontier
    - icecream # Frontier

- type: entity
  name: 太空冰凍
  parent: FoodFrozenBase
  id: FoodFrozenFreezy
  description: 太空中最好吃的冰淇淋。
  components:
  - type: Sprite
    state: spacefreezy
  - type: FlavorProfile # Frontier: add flavour profile
    flavors: # Frontier
    - sweet # Frontier
    - blueraspberry # Frontier
    - icecream # Frontier

- type: entity
  name: 聖代冰淇淋 # Frontier: no hyphen
  parent: FoodFrozenBase
  id: FoodFrozenSundae
  description: 一道經典的甜點。
  components:
  - type: Sprite
    state: sundae # Frontier: spacefreezy<sundae
  - type: FlavorProfile # Frontier: add flavour profile
    flavors: # Frontier
    - sweet # Frontier
    - icecream # Frontier

- type: entity
  name: 巧克力角 # Frontier: cornuto<choco horn
  parent: FoodFrozenBase
  id: FoodFrozenCornuto
  description: 一個那不勒斯香草與巧克力口味的冰淇淋甜筒。上面撒了些焦糖堅果，看起來令人垂涎。
  components:
  - type: Item
    storedRotation: -45
  - type: Sprite
    state: cornuto
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Theobromine
          Quantity: 1
  - type: FlavorProfile # Frontier: add flavour profile
    flavors: # Frontier
    - sweet # Frontier
    - icecream # Frontier
    - chocolate # Frontier

# Popsicle

- type: entity
  name: 橘子霜淇淋
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleOrange
  description: 一款經典的橘味奶油冰棒。一份充滿陽光氣息的冰涼點心。
  components:
  - type: Sprite
    layers:
    - state: stick
    - state: popsicle-base
    - state: popsicle
      color: orange
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: Tag
    tags:
    - Fruit
    - Creamsicle
  - type: FlavorProfile # Frontier: add flavour profile
    flavors: # Frontier
    - sweet # Frontier
    - icecream # Frontier
    - orange # Frontier

- type: entity
  name: 莓果霜淇淋
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleBerry
  description: 一款風味鮮活的莓果奶油冰棒。一款莓果風味絕佳的冰品。
  components:
  - type: Sprite
    layers:
    - state: stick
    - state: popsicle-base
    - state: popsicle
      color: red
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: Tag
    tags:
    - Fruit
    - Creamsicle
  - type: FlavorProfile # Frontier: add flavour profile
    flavors: # Frontier
    - sweet # Frontier
    - icecream # Frontier
    - berry # Frontier

- type: entity
  name: 巨無霸冰淇淋
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleJumbo
  description: 一款裹滿濃郁巧克力的奢華冰淇淋。它的尺寸比你記憶中的要小一些。
  components:
  - type: Sprite
    layers:
    - state: stick
    - state: jumbo
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20 # Frontier: 30<20
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Theobromine
          Quantity: 1
  - type: FlavorProfile # Frontier: add flavour profile
    flavors: # Frontier
    - sweet # Frontier
    - icecream # Frontier
    - chocolate # Frontier

# Snowcone

# Use this one as a base for other colored snowcones. Apply a color to the alpha
# layer depending on soda/syrup/waterever. Name and description will also have
# to be modified.
- type: entity
  name: 甜味刨冰
  #  name: [Flavor] snowcone
  parent: FoodFrozenBase
  id: FoodFrozenSnowconeBase
  description: 這只是刨冰和簡單糖漿，完全不用費什麼功夫。
  #  description: [Liquid] drizzled over a snowball in a paper cup.
  components:
    - type: Sprite
      layers:
        - state: cone
        - state: alpha-filling
    #      color: foo
    - type: Edible
      trash:
      - FoodFrozenSnowconeTrash
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 20 # For sprinkles or something? Idk.
          reagents:
            - ReagentId: Ice
              Quantity: 8
            - ReagentId: Water
              Quantity: 2
            - ReagentId: Sugar
              Quantity: 2
    - type: FlavorProfile # Frontier: add flavour profile
      flavors: # Frontier
      - sweet # Frontier
      - cold # Frontier

- type: entity
  name: 沒有味道的刨冰
  parent: FoodFrozenSnowconeBase
  id: FoodFrozenSnowcone
  description: 這只是刨冰罷了。但嚼起來還是很有趣。
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
          - ReagentId: Ice
            Quantity: 8
  - type: FlavorProfile # Frontier: add flavour profile
    flavors: # Frontier
    - ice # Frontier
    - cold # Frontier

- type: entity
  name: 莓果刨冰
  parent: FoodFrozenSnowconeBase
  id: FoodFrozenSnowconeBerry
  description: 將莓果糖漿淋在紙杯裡的雪球上。
  components:
