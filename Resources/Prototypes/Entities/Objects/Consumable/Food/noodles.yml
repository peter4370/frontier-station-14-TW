# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_meal.yml
# Base

- type: entity
  abstract: true
  parent: FoodInjectableBase
  id: FoodNoodlesBase
  description: 這真是道美味的義大利麵啊！
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    sprite: Objects/Consumable/Food/noodles.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 15 # Frontier: 20<15
        - ReagentId: Flavorol # Frontier
          Quantity: 10 # Frontier

# Noodles

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodlesBoiled
  name: 水煮義大利麵
  description: 這是一盤普通的麵，需要多加些配料才行。
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
  - type: Sprite
    state: boiled
# Tastes like pasta.

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodles
  name: spaghetti
  description: 義大利麵配番茄碎。就跟你那個虐待你的父親以前做的一樣！
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
      - tomato
  - type: Sprite
    state: tomato
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 40
        reagents:
        - ReagentId: Nutriment
          Quantity: 15 # Frontier: 35<15
        - ReagentId: Flavorol # Frontier
          Quantity: 15 # Frontier
  - type: Tag
    tags:
    - Fruit
# Tastes like pasta, tomato.

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodlesCopy
  name: 複製貼上
  description: 你最好別試這個，總聽到大家說這有多糟糕……
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Edible
    trash:
    - FoodPlateSmall
    - FoodPlateSmall
  - type: FlavorProfile
    flavors:
      - copypasta
  - type: Sprite
    state: copypasta
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 80
        reagents:
        - ReagentId: Nutriment
          Quantity: 30 # Frontier: 70<30
        - ReagentId: Flavorol # Frontier
          Quantity: 30 # Frontier
# Tastes like pasta, bad humor.

