  description: 吃起來和看起來一樣噁心。
  components:
  - type: FlavorProfile
    flavors:
      - meaty
  - type: Sprite
    state: meat
  - type: Tag
    tags:
    - Meat
    - Donut
# Tastes like meat.

- type: entity
