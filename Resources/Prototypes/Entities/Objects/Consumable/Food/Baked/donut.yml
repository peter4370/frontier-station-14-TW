# Base

- type: entity
  parent: [VendPriceFoodBase100, FoodInjectableBase] #  Frontier - VendPriceFoodBase100
  id: FoodDonutBase
  abstract: true
  description: 非常適合搭配濃郁的咖啡。
  components:
  - type: Tag
    tags:
    - Donut
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/donut.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
  - type: Item
    sprite: Objects/Consumable/Food/Baked/donut.rsi
    size: Tiny
  - type: StaticPrice # Frontier
    price: 14 # Frontier

- type: entity
  abstract: true
  parent: FoodDonutBase
  id: FoodDonutFruitBase
  components:
  - type: Tag
    tags:
    - Donut
    - Fruit
# Tastes like donut.

# The sprinkles are now an overlay, so you can put them on any donut! If we really
# wanted to go for EXTREME roleplay we could apply a different color to the sprinkles
# Since it's technically an alpha layer.

# You'll be able to bake the plain donuts, then mix up different glazes for them to
# apply with a brush or something.

# Plain Donuts

- type: entity
  name: 原味甜甜圈
  parent: FoodDonutBase
  id: FoodDonutPlain
  components:
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    state: plain

- type: entity
  name: 原味果凍甜甜圈
  parent: FoodDonutBase
  id: FoodDonutJellyPlain
  components:
  - type: FlavorProfile
    flavors:
      - jelly
  - type: Sprite
    state: jelly-plain
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: Vitamin
          Quantity: 1

# Donuts

- type: entity
  name: 甜甜圈
  parent: FoodDonutBase
  id: FoodDonutHomer
  components:
  - type: FlavorProfile
    flavors:
      - pink
  - type: Sprite
    state: homer
  - type: Item
    heldPrefix: pink

- type: entity
  name: 混沌甜甜圈
  parent: FoodDonutBase
  id: FoodDonutChaos
  description: 就像人生一樣，它的滋味總是不盡相同。
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - funny
      - magical
      - tingly
  - type: Sprite
    state: chaos
# Tastes like donut, chaos.

- type: entity
