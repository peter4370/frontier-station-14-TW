# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_baked_whole.yml & food_baked_single.yml
# Base

- type: entity
  abstract: true
  parent: FoodInjectableBase
  id: FoodPieBase
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/pie.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents: #Most of these are this with slight variations, not worth changing until we have the rest of the reagents
        - ReagentId: Nutriment
          Quantity: 20 # Frontier: 30<20
        - ReagentId: Vitamin
          Quantity: 10 # Frontier: 14<10
        - ReagentId: Sugar
          Quantity: 5
        - ReagentId: Flavorol # Frontier
          Quantity: 15 # Frontier
  - type: Edible #It's actually possible now to have a pie stored in a tin rather than spawning trash when you finish eating it. But right now I'm just cleaning up.
    trash:
    - FoodPlateTin
  - type: SliceableFood
    count: 4
  - type: Tag
    tags:
    - Pie

- type: entity
  parent: FoodInjectableBase # Not sliceable
  id: FoodPieSliceBase
  abstract: true
  description: 一塊派。真好吃！
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/pie.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12.5 # Frontier: 7<12.5
        reagents:
        - ReagentId: Nutriment
          Quantity: 5 # Frontier: 7.5<5
        - ReagentId: Vitamin
          Quantity: 2.5 # Frontier: 3.5<2.5
        - ReagentId: Sugar
          Quantity: 1.25
        - ReagentId: Flavorol # Frontier
          Quantity: 2.75 # Frontier
  - type: Tag
    tags:
    - Pie
    - Slice

