# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_baked_whole.yml & food_baked_single.yml
# Base

- type: entity
  parent: FoodInjectableBase
  id: FoodCakeBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/cake.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 55 # flavored cakes have less room for spiking
        reagents:
        - ReagentId: Nutriment
          Quantity: 20 # Frontier: 40<20
        - ReagentId: Vitamin
          Quantity: 5 # Frontier: 5<10
        - ReagentId: Flavorol
          Quantity: 20
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - Cake
  - type: SecretStash
    maxItemSize: "Normal"
    secretStashName: secret-stash-cake
    damageEatenItemInside:
      types:
        Slash: 7.5
  - type: ToolOpenable
    openToolQualityNeeded: Slicing
    closeToolQualityNeeded: Slicing
    verbOnly: true
  - type: ContainerContainer
    containers:
      stash: !type:ContainerSlot {}

- type: entity
  parent: FoodCakeBase
  id: FoodCakeSliceBase
  abstract: true
  description: 只是一片蛋糕，足夠大家分了。
  components:
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Food
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 11 # Frontier: 12<11
        reagents:
        - ReagentId: Nutriment
          Quantity: 4 # Frontier: 8<4
        - ReagentId: Vitamin
          Quantity: 1 # Frontier: 2<1
        - ReagentId: Flavorol # Frontier
          Quantity: 4 # Frontier
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Cake
    - Slice

# Custom Cake Example

- type: entity
  name: 藍莓蛋糕
  parent: FoodCakeBase
