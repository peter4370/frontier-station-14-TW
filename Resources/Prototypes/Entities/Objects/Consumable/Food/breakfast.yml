# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_breakfast.yml

# Base

- type: entity
  abstract: true
  parent: FoodInjectableBase
  id: FoodBreakfastBase
  description: 一頓豐盛的早餐，精神抖擻地開始新的一天！
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Consumable/Food/breakfast.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 60
        reagents:
        - ReagentId: Nutriment
          Quantity: 40
        - ReagentId: Vitamin
          Quantity: 10

# Breakfasts

- type: entity
  parent: FoodBreakfastBase
  id: FoodBreakfastAmerican
  name: 美式全套早餐
  description: 一大盤富含蛋白質和碳水化合物的食物，與其說能讓你起床，不如說更可能讓你重新倒回床上。哎，這又是什麼新的折磨啊？
  components:
  - type: FlavorProfile
    flavors:
      - food
  - type: Sprite
    state: fullamerican

- type: entity
  parent: FoodBreakfastBase
  id: FoodBreakfastEnglish
  name: 英式全套早餐
  description: 一大盤富含蛋白質和碳水化合物的食物，與其說能讓你起床，不如說更可能讓你倒回床上。別提那場戰爭了！
  components:
  - type: FlavorProfile
    flavors:
      - food
  - type: Sprite
    state: fullenglish
