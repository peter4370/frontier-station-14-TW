          Quantity: 20
  - type: Sprite
    state: shaker-salt
  - type: Icon
    state: shaker-salt
  - type: Tag
    tags:
      - SaltShaker

- type: entity
  parent: BaseFoodShaker
  id: FoodShakerPepper
  name: 胡椒罐
  description: Often used to flavor food or make people sneeze.
  components:
