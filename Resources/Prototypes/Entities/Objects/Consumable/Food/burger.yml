# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_single.yml
# Bun

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBun
  name: bun
  description: 一個漢堡麵包。圓圓的，拿起來很方便。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/burger.rsi
    layers:
    - state: bun
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 6.66 # 1/3 of a loaf of bread, technically losing 0.01 nutriment per batch of three buns over making bread loaves/slices
  - type: Butcherable
    butcherDelay: 1
    spawned:
      - id: FoodBreadBunTop
        amount: 1
      - id: FoodBreadBunBottom
        amount: 1
  - type: Construction # Frontier - hotdog making
    graph: NFHotdog # Frontier - hotdog making
    node: start # Frontier - hotdog making

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBunBottom
  name: 底部麵包胚
  description: 是時候開始堆疊漢堡塔了。
  components:
  - type: Item
    size: Normal #patch until there is an adequate resizing system in place
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: Objects/Consumable/Food/burger_sequence.rsi
    layers:
    - state: bun_bottom
    - map: ["foodSequenceLayers"]
  - type: FoodSequenceStartPoint
    key: Burger
    maxLayers: 10
    startPosition: 0, 0
    offset: 0, 0.07
    minLayerOffset: -0.05, 0
    maxLayerOffset: 0.05, 0
    nameGeneration: food-sequence-burger-gen
  - type: Appearance
  - type: FoodMetamorphableByAdding
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        canReact: false # Dont want cause reactions inside burgers after merging ingredients
        reagents:
        - ReagentId: Nutriment
          Quantity: 3.3 # 1/2 of a bun

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBunTop
  name: 高馬尾
  description: 為您的漢堡塔畫下完美的句點。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/burger_sequence.rsi
    layers:
    - state: bun_top
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Nutriment
          Quantity: 3.3 # 1/2 of a bun
  - type: FoodSequenceElement
    entries:
      Burger: BunTopBurger

# Base

- type: entity
  abstract: true
  parent: FoodInjectableBase
  id: FoodBurgerBase
  components:
  - type: FlavorProfile
    flavors:
      - bun
      - meaty
  - type: Sprite
    sprite: Objects/Consumable/Food/burger.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 7
        - ReagentId: Vitamin
          Quantity: 3
  - type: Item
    sprite: Objects/Consumable/Food/burger.rsi
    shape:
    - 0,0,1,0

