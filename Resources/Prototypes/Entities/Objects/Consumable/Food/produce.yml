# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_produce.yml
# For produce that can't be immediately eaten

- type: entity
  parent: [BaseItem, RecyclableItemOrganicTiny] # Frontier: added RecyclableItemOrganicTiny
  id: ProduceBase
  abstract: true
  components:
  - type: SolutionContainerManager
  - type: Sprite
    state: produce
  - type: Produce
  - type: PotencyVisuals
  - type: Appearance
  - type: Extractable
    grindableSolutionName: food

- type: entity
  parent: ProduceBase
  id: ProduceBaseRuminant
  abstract: true
  components:
  # let cows eat raw produce like wheat and oats
  - type: Edible
    requiresSpecialDigestion: true
  - type: Tag
    tags:
    - Ruminant

# For produce that can be immediately eaten

- type: entity
  parent: [FoodInjectableBase, RecyclableItemOrganicTiny] # Frontier: added RecyclableItemOrganicTiny
  id: FoodProduceBase
  abstract: true
  components:
  - type: SolutionContainerManager
  - type: Sprite
    state: produce
  - type: Produce
  - type: PotencyVisuals
  - type: Appearance
  - type: Extractable
    grindableSolutionName: food

