- type: entity
  abstract: true
  parent: [ DrinkBaseMaterialPlastic, DrinkBase, DrinkBaseOpenable ]
  id: DrinkBottlePlasticBaseFull
  suffix: Full
  components:
  - type: Item
    size: Normal
  - type: Openable
    sound:
      collection: bottleOpenSounds
    closeable: true
    closeSound:
      collection: bottleCloseSounds
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
  - type: Sprite
    sprite: Objects/Consumable/Drinks/generic_jug.rsi # fallback to generic plastic jug
  - type: TrashOnSolutionEmpty
    solution: drink
  - type: Tag
    tags:
    - DrinkBottle # Needed to fit in the soda dispenser, needs a better name

- type: entity
  abstract: true
  parent: DrinkBottlePlasticBaseFull
  id: DrinkBottlePlasticSmallBaseFull
  components:
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
  - type: Sprite
    sprite: Objects/Consumable/Drinks/waterbottle.rsi # fallback
  - type: FitsInDispenser
    solution: drink

# Empty

- type: entity
  parent: [DrinkVisualsOpenable, DrinkBottlePlasticBaseFull]
  id: CustomDrinkJug
  name: 飲料壺
  description: 一個用於存放特製飲品的壺。
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 150

# Small Plastic Bottles

- type: entity
  parent: [DrinkVisualsAllFilled, DrinkBottlePlasticSmallBaseFull]
  id: DrinkWaterBottleFull
  name: 水瓶
  description: 來源不明的簡單純淨水。你或許覺得，自己根本不想知道它的來源。
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: Water
          Quantity: 30
  - type: Sprite
    sprite: Objects/Consumable/Drinks/waterbottle.rsi
  - type: Label
    currentLabel: reagent-name-water

