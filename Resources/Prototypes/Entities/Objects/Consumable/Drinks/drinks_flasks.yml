  - type: Engraveable # Frontier

- type: entity
  parent: FlaskBase
  id: DrinkVacuumFlask
  name: 保溫瓶
  description: 自 1892 年以來，始終為您的飲品維持完美溫度。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/vacuumflask.rsi
  - type: Tool
    qualities:
    - Rolling # Perfectly cylindrical flask
    speedModifier: 0.75
