- type: entity
  abstract: true
  parent: [DrinkBaseMaterialStrongMetal, DrinkBase, DrinkBaseOpenable, DrinkVisualsOpenable]
  id: FlaskBase
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
  - type: Sprite
    sprite: Objects/Consumable/Drinks/flask.rsi
  - type: FitsInDispenser
    solution: drink
  - type: Openable
    sound:
      collection: flaskOpenSounds
    closeable: true
    closeSound:
      collection: flaskCloseSounds

# Flasks

- type: entity
  parent: [DrinkBaseMaterialStrongMetal, DrinkBase]
  id: DrinkFlaskOld
  name: 舊酒壺
  description: 一個破舊的老酒壺，蓋子似乎遺失了。
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
  - type: Sprite
    sprite: Objects/Consumable/Drinks/flask_old.rsi
  - type: FitsInDispenser
    solution: drink
  - type: Engraveable # Frontier

- type: entity
  parent: FlaskBase
  id: DrinkShinyFlask
  name: 閃亮的燒瓶
  description: 一個閃亮的金屬燒瓶。上面似乎刻著一個希臘符號。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/shinyflask.rsi
  - type: Engraveable # Frontier

- type: entity
  parent: FlaskBase
  id: DrinkMREFlask
  suffix: Full
  name: MRE 飯盒
  description: 一只舊軍用水壺，裝滿了專為士兵準備的頂級飲品。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/mreflask.rsi
  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: Water
          Quantity: 50
  - type: TrashOnSolutionEmpty
    solution: drink
  - type: StaticPrice
    price: 20 # Frontier: 12.5<20

- type: entity
  parent: FlaskBase
  id: DrinkDetFlask
  name: 檢查員的燒瓶
  description: 一個纏有皮帶並綴有金色徽章的金屬酒壺，屬於那位督察。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/detflask.rsi
  - type: Engraveable # Frontier

- type: entity
  parent: FlaskBase
  id: DrinkHosFlask
  name: 霍斯的酒壺
  description: 一款金屬水壺，專為辛勤工作的部門主管而設計。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/hosflask.rsi
  - type: Engraveable # Frontier

- type: entity
  parent: FlaskBase
  id: DrinkFlask
  name: 船長的水壺
  description: 一個屬於船長的金屬酒壺。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/flask.rsi
  - type: Engraveable # Frontier

- type: entity
  parent: FlaskBase
  id: DrinkFlaskBar
  name: 酒吧用燒瓶
