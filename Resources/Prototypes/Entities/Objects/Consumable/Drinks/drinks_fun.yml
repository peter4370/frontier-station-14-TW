- type: entity
  parent: [DrinkVisualsAllFilled, DrinkBottleGlassSmallBaseFull]
  id: DrinkMopwataBottleRandom
  name: 美味的莫帕塔
  description: 一瓶霧蒙蒙的棕色玻璃瓶，瓶身上的標籤已褪色，畫著一把拖把。瓶內裝滿了渾濁的……陳年酒液。
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 50
        reagents:
        - ReagentId: Mopwata
          Quantity: 40
  - type: RandomFillSolution
    solution: drink
    weightedRandomId: RandomFillMopwata
  - type: Sprite
    sprite: Objects/Consumable/Drinks/mopwata.rsi
