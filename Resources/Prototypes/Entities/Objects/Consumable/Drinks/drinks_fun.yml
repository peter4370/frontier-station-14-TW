- type: entity
  abstract: true
  parent: [ DrinkBaseMaterialPlastic, DrinkBase, DrinkBaseOpenable, DrinkVisualsAllFilled, RecyclableItemPlasticSmall ] # Frontier: added RecyclableItemPlasticSmall
  id: BaseSqueezeBottle
  components:
  - type: Openable
    sound:
      collection: packetOpenSounds
  - type: Sprite
    layers:
    - state: icon_empty
      map: ["enum.OpenableVisuals.Layer"]
    - state: fill-6
      map: [ "enum.SolutionContainerLayers.Fill" ] # already has liquid, so no visible: false
    - state: icon-front
      map: [ "enum.SolutionContainerLayers.Overlay" ]
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
  - type: SolutionContainerVisuals
    maxFillLevels: 6
  - type: TrashOnSolutionEmpty
    solution: drink

- type: entity
  parent: BaseSqueezeBottle
  id: DrinkSpaceGlue
  name: 太空膠管
  description: 這款高性能黏合劑專為極其複雜的機械設備維護而設計。請勿飲用！
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/glue-tube.rsi
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: SpaceGlue
          Quantity: 30
  - type: Tag
    tags:
      - DrinkSpaceGlue
  - type: Glue

- type: entity
  parent: BaseSqueezeBottle
  id: DrinkSpaceLube
  name: 太空潤滑管
  description: 一款專為維護極其複雜的機械設備而設計的高性能潤滑劑。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/lube-tube.rsi
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: SpaceLube
          Quantity: 30
  - type: Lube

# Find your nearest clown and give them a gift :o)
- type: entity
  parent: BluespaceBeaker
  id: BottomlessLube
  name: 無底潤滑劑量杯
  suffix: DEBUG
  description: 這只異常的燒杯能無限生產太空潤滑劑，因此必須嚴加看管，以免落入不法之徒手中。
  components:
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 1000
        reagents:
        - ReagentId: SpaceLube
          Quantity: 1000
  - type: SolutionRegeneration
    solution: beaker
    generated:
      reagents:
      - ReagentId: SpaceLube
        Quantity: 200

- type: entity
  parent: [DrinkBaseMaterialGlass, DrinkBase]
  id: DrinkJarWhat
  name: 一罐什麼東西
  description: 實在很難說這到底是什麼。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/jar_what.rsi
  - type: FitsInDispenser
    solution: drink
  - type: Tag
    tags:
    - DrinkGlass

