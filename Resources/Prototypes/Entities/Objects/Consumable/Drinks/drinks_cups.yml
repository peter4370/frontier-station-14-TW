# A cup is a small container used to hold liquids for drinking.[1]
- type: entity
  abstract: true
  parent: DrinkBase
  id: DrinkBaseCup
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 20
  - type: FitsInDispenser
    solution: drink
  - type: SolutionTransfer
    canChangeTransferAmount: true
    maxTransferAmount: 10
  - type: Tag
    tags:
    - DrinkCup
  - type: StaticPrice
    price: 10

# A mug is a type of cup.[2]
- type: entity
  abstract: true
  parent: [ DrinkBaseMaterialPorcelain, DrinkBaseCup, DrinkVisualsFill ]
  id: DrinkBaseMug
  name: mug
  description: 一個馬克杯。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/mug.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    inHandsFillBaseName: null

## Misc Cups

- type: entity
  parent: [DrinkBaseMaterialGold, DrinkBaseCup]
  id: DrinkGoldenCup
  name: 金盃
  description: 一座金杯。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/golden_cup.rsi
  - type: StaticPrice
    price: 125
  - type: PhysicalComposition
    materialComposition:
      Gold: 100 # Frontier 25<100
  - type: NFTreasure # Frontier

- type: entity
  parent: DrinkBaseMug # a teacup is basically a mug
  id: DrinkTeacupEmpty
  name: 茶杯
  suffix : Empty # Frontier
  description: 一個素面白色瓷茶杯。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/teacup.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 4
  # Frontier: add broken teacup spawning
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassCrack
      - !type:SpillBehavior { }
      - !type:SpawnEntitiesBehavior
        spawn:
          BrokenTeacup:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
   # End Frontier

- type: entity
  parent: [ DrinkBaseMaterialGlass, DrinkBaseCup, DrinkVisualsFillOverlay ]
  id: DrinkGlassCoupeShaped
  name: 杯型玻璃杯
  description: 一款經典的細頸雙耳酒杯，是銀河系各地木箱上「易碎品」標籤的象徵。
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/glass_coupe_shape.rsi
  - type: SolutionContainerVisuals
    inHandsMaxFillLevels: 1

- type: entity
  parent: [DrinkBaseMaterialCardboard, DrinkBaseCup, DrinkBaseEmptyTrash, DrinkVisualsFill]
  id: DrinkWaterCup
  name: 水杯
  description: 一個紙製水杯。
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 5 # One sip at a time. No rushing at the water cooler
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Consumable/Drinks/water_cup.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    inHandsFillBaseName: null
  - type: Tag
    tags:
    - Trash
    - DrinkCup
    - WhitelistChameleon
  - type: Clothing
    slots:
    - HEAD
    quickEquip: false
    sprite: Clothing/Head/Hats/party_water_cup.rsi
  - type: SpillWhenWorn
    solution: drink

