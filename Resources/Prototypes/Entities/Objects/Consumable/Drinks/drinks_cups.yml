## Filled

- type: entity
  parent: DrinkBaseMug
  id: DrinkHotCoco
  name: 熱巧克力
  suffix: Full
  description: 一種由融化的巧克力與熱牛奶調製而成的熱飲。
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: HotCocoa
          Quantity: 20
  - type: Icon
    sprite: Objects/Consumable/Drinks/mug.rsi
    state: icon-vend-brown
  - type: Sprite
    layers:
    - state: icon
    - state: fill-3
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: TrashOnSolutionEmpty
    solution: drink

