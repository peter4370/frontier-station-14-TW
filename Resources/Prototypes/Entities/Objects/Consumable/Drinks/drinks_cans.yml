# When adding new drinks also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\drinks_soda.yml
- type: entity
  abstract: true
  parent: [ DrinkBaseMaterialMetal, DrinkBase, DrinkBaseOpenable, DrinkVisualsOpenable ]
  id: DrinkCanBaseFull
  suffix: Full
  components:
  - type: GoblinPreciousTrash # Frontier
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
      grindable: &grindable
        reagents: # 5u -> 1/2 steel sheet (10u)
        - ReagentId: Aluminium # Fun fact: soda can makeup is approx. 75% aluminium and 25% tin/iron.
          Quantity: 4
        - ReagentId: Iron
          Quantity: 1
  - type: SolutionTransfer
    canChangeTransferAmount: true
    maxTransferAmount: 15
  - type: Extractable
    grindableSolutionName: grindable
  - type: FitsInDispenser
    solution: drink
  - type: Tool
    qualities:
    - Rolling
    speedModifier: 0.25 # its small so takes longer to roll the entire dough flat
  - type: SpaceGarbage
  - type: TrashOnSolutionEmpty
    solution: drink
  - type: PhysicalComposition
    materialComposition:
      Steel: 50 #reduce, reuse, recycle
  - type: Tag
    tags:
    - DrinkCan
  - type: StaticPrice # Frontier
    price: 5.5 # Frontier

## Filled

- type: entity
  parent: DrinkCanBaseFull
  id: DrinkColaCan
  name: 太空可樂罐
  description: A sweet, carbonated soft drink.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: Cola
          Quantity: 30
      grindable: *grindable
  - type: Tag
    tags:
    - Cola
    - DrinkCan
  - type: Sprite
    sprite: Objects/Consumable/Drinks/cola.rsi
  - type: Item
    sprite: Objects/Consumable/Drinks/cola.rsi

