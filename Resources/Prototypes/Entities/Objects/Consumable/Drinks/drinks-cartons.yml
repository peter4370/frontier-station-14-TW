- type: entity
  abstract: true
  parent: [ DrinkBaseMaterialCardboard, DrinkBase, DrinkBaseOpenable, DrinkVisualsOpenable, RecyclableItemCardboard ] # Frontier: added RecyclableItemCardboard
  id: DrinkCartonBaseFull
  suffix: Full
  components:
  - type: Openable
    sound:
      collection: bottleOpenSounds #Could use a new sound someday ¯\_(ツ)_/¯
    closeable: true
    closeSound:
      collection: bottleCloseSounds
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
  - type: TrashOnSolutionEmpty
    solution: drink
  - type: Item
    size: Normal
  - type: Tag # Frontier - allow into coffee machines
    tags: # Frontier
    - DrinkBottle # Frontier

- type: entity
  abstract: true
  parent: DrinkCartonBaseFull
  id: DrinkCartonSmallBaseFull
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 50
  - type: Item
    size: Small

- type: entity
  abstract: true
  parent: DrinkCartonBaseFull
  id: DrinkCartonBaseXtraLargeFull
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 150
  - type: Tag
    tags:
    - DrinkBottle # Need this to fit in the soda dispenser, probably needs a better name

# Small carton

- type: entity
  parent: [DrinkBaseMaterialPlastic, DrinkCartonSmallBaseFull]
  id: DrinkJuiceLimeCarton
  name: lime juice
  description: 酸甜可口。
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: JuiceLime
          Quantity: 50
  - type: Sprite
    sprite: Objects/Consumable/Drinks/limejuice.rsi

