  description: 一台似乎發生了某種災難性故障的 S.U.P.E.R.P.A.C.M.A.N. 發電機。它正在洩漏鈾。
  components:
  - type: Sprite
    sprite: Objects/Materials/Scrap/generator.rsi
    layers:
      - state: uranium_generator
      - map: [ "extra" ]
      - state: rad_dripping
        shader: unshaded
      - state: rad_outline
        shader: unshaded
  - type: RandomSprite
    available:
    - extra:
        red_x: ""
        nothing: ""
  - type: MultiHandedItem
  - type: PhysicalComposition
    materialComposition:
      Steel: 4000 # 40 sheets
      FuelGradeUranium: 2500 # 25 sheets # Frontier: Uranium<FuelGradeUranium
      Plastic: 500 # 5 sheets
      RawScrap: 1500 # Frontier: 15 sheets
      RawScrapTech: 300 # Frontier: 3 sheet
