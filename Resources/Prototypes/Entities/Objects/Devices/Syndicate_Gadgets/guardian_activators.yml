- type: entity
  name: 全息寄生體注射器
  suffix: Ghost # Frontier
  id: HoloparasiteInjector
  parent: [BaseItem, BaseC3SyndicateContraband] # Frontier: BaseSyndicateContraband<BaseC3SyndicateContraband
  description: 一件由手持裝置組成的複雜藝術品，讓使用者能夠寄宿一名全息寄生守護者。
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    state: combat_hypo
  - type: GuardianCreator
    guardianProto: MobHoloparasiteGuardian

- type: entity
  name: 全息小丑注射器
  parent: HoloparasiteInjector
  suffix: Ghost # Frontier
  id: HoloClownInjector
  description: 一件由手持機械組成的複雜藝術品，讓使用者能夠收養一名全息小丑守護者。
  components:
  - type: GuardianCreator
    guardianProto: MobHoloClownGuardian

- type: entity
  name: 神燈
  id: MagicalLamp
  suffix: Ghost # Frontier
  parent: BaseItem
  description: 在精靈商品醜聞爆發後，巫師聯盟不得不採取節流措施。
  components:
  - type: Sprite
    sprite: Objects/Misc/Lights/lamp.rsi
    layers:
      - state: lamp
  - type: GuardianCreator
    guardianProto: MobIfritGuardian

- type: entity
  name: 全息寄生盒
  suffix: Ghost # Frontier
  parent: [BoxCardboard, BaseC3SyndicateContraband] # Frontier: BaseSyndicateContraband<BaseC3SyndicateContraband
  id: BoxHoloparasite
  description: 一個裝有全息寄生蟲注射器的盒子。
  components:
  - type: StorageFill
    contents:
      - id: HoloparasiteInjector
      - id: HoloparasiteInfo
      - id: ClothingHeadHatBizarreSoft
  - type: Sprite
    layers:
      - state: box
      - state: holo

- type: entity
  name: 全息小丑盒
  suffix: Ghost # Frontier
  parent: [BoxCardboard, BaseC3SyndicateContraband] # Frontier: BaseSyndicateContraband<BaseC3SyndicateContraband
  id: BoxHoloclown
  description: 一個裝有全息小丑注射器的盒子。
  components:
  - type: StorageFill
    contents:
      - id: HoloClownInjector
      - id: ToyFigurineHoloClown
      - id: ToyHammer
  - type: Sprite
    layers:
      - state: box_hug
      - state: holo
  - type: Tag
    tags:
      - BoxHug