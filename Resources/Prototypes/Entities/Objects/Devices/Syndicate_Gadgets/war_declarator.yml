- type: entity
  parent: [BaseItem, BaseC3SyndicateContraband ] # Frontier: BaseSyndicateContraband<BaseC3SyndicateContraband
  id: NukeOpsDeclarationOfWar
  name: 宣戰者
  description: 用於向目標發出宣戰書，藉此延遲你的穿梭機起飛時間，讓對方有時間為你的襲擊做準備。如此大膽的舉動將吸引「辛迪加」內強大金主們的注意，他們將為你的團隊提供大量額外的電晶石。必須在任務開始時使用，否則你的金主們將會失去興趣。
  components:
    - type: Sprite
      sprite: Objects/Devices/declaration_of_war.rsi
      layers:
        - state: declarator
    - type: Item
    - type: UseDelay
      delay: 0.5
    - type: ActivatableUI
      inHandsOnly: true
      singleUser: true
      requireActiveHand: false
      key: enum.WarDeclaratorUiKey.Key
    - type: UserInterface
      interfaces:
        enum.WarDeclaratorUiKey.Key:
          type: WarDeclaratorBoundUserInterface
    - type: WarDeclarator
      message: war-declarator-default-message
    - type: AccessReader
      access: [["NuclearOperative"]]
