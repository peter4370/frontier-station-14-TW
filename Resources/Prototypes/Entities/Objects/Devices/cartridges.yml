- type: entity
  parent: NFBasePDACartridge # Frontier: BaseItem<NFBasePDACartridge
  id: NotekeeperCartridge
  name: Notekeeper 替換式墨水匣
  description: 一款用於記錄筆記的程式。
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridge.rsi
    state: cart-y
  - type: UIFragment
    ui: !type:NotekeeperUi
  - type: Cartridge
    programName: notekeeper-program-name
    icon:
      sprite:  Objects/Misc/books.rsi
      state: book_icon
  - type: NotekeeperCartridge


- type: entity
  parent: BaseItem
  id: NanoTaskCartridge
  name: NanoTask 耗材盒
  description: 一款可讓您建立待辦事項清單的程式。
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridge.rsi
    state: cart-nav
  - type: Cartridge
    programName: nano-task-program-name
    icon:
      sprite: Interface/Misc/program_icons.rsi
      state: nano_task
  - type: UIFragment
    ui: !type:NanoTaskUi
  - type: NanoTaskCartridge

- type: entity
