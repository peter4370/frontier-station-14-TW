- type: entity
  parent: NFBasePDACartridge # Frontier: BaseItem<NFBasePDACartridge
  id: NetProbeCartridge
  name: NetProbe 卡匣
  description: 一個用於取得網路裝置位址與頻率的程式。
  components:
    - type: Sprite
      sprite: Objects/Devices/cartridge.rsi
      state: cart-y
    - type: UIFragment
      ui: !type:NetProbeUi
    - type: Cartridge
      programName: net-probe-program-name
      icon:
        sprite: Structures/Machines/server.rsi
        state: server
    - type: NetProbeCartridge

- type: entity
  parent: NFBasePDACartridge # Frontier: BaseItem<NFBasePDACartridge
  id: LogProbeCartridge
  name: LogProbe 卡匣
  description: 一個用於從裝置擷取存取日誌的程式。
  components:
    - type: Sprite
      sprite: Objects/Devices/cartridge.rsi
      state: cart-log
    - type: Icon
      sprite: Objects/Devices/cartridge.rsi
      state: cart-log
    - type: UIFragment
      ui: !type:LogProbeUi
    - type: Cartridge
      programName: log-probe-program-name
      icon:
        sprite: _NF/Structures/Doors/Airlocks/Standard/nfsd.rsi # Frontier: Swap security to NFSD
        state: closed
    - type: LogProbeCartridge
    - type: GuideHelp
      guides:
      - Forensics

- type: entity
  parent: NFBasePDACartridge # Frontier: BaseItem<NFBasePDACartridge
  id: WantedListCartridge
  name: 通緝名單彈匣
  description: 一個用來取得通緝人員名單的程式。
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridge.rsi
    state: cart-sec
  - type: Icon
    sprite: Objects/Devices/cartridge.rsi
    state: cart-sec
  - type: UIFragment
    ui: !type:WantedListUi
  - type: Cartridge
    programName: wanted-list-program-name
    icon:
      sprite: Objects/Misc/books.rsi
      state: icon_magnifier
    readonly: true # Frontier
  - type: WantedListCartridge
  - type: StealTarget
    stealGroup: WantedListCartridge

- type: entity
  parent: NFBasePDACartridge # Frontier: BaseItem<NFBasePDACartridge
  id: MedTekCartridge
  name: MedTek 藥筒
  description: 一個提供醫療診斷工具的程式。
  components:
    - type: Sprite
      sprite: Objects/Devices/cartridge.rsi
      state: cart-med
    - type: Icon
      sprite: Objects/Devices/cartridge.rsi
      state: cart-med
    - type: Cartridge
      programName: med-tek-program-name
      icon:
        sprite: Objects/Specific/Medical/healthanalyzer.rsi
        state: icon
    - type: MedTekCartridge
    # Frontier: Add MedTekCartridgePrinter
    - type: MedTekCartridgePrinter
      printTemplate: PaperWrittenMedicalMedtekPatientRecord
    # End Frontier: Add MedTekCartridgePrinter

