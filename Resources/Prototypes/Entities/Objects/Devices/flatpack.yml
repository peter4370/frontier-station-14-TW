- type: entity
  parent: [BaseItem, RecyclableItemDeviceComplexNormal] # Frontier: added RecyclableItemDeviceComplexNormal
  id: BaseFlatpack
  name: 基本平裝盒
  description: 用於組裝某物的平板包裝。
  categories:
  - HideSpawnMenu
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: Objects/Devices/flatpack.rsi
    layers:
    - state: base
    - state: overlay
      color: "#cec8ac"
      map: ["enum.FlatpackVisualLayers.Overlay"]
    - state: icon-default
  - type: Appearance
  - type: Flatpack
    boardColors:
      command: "#334E6D"
      medical: "#52B4E9"
      service: "#9FED58"
      engineering: "#EFB341"
      security: "#DE3A3A"
      science: "#D381C9"
      supply: "#A46106"
      cpu_command: "#334E6D"
      cpu_medical: "#52B4E9"
      cpu_service: "#9FED58"
      cpu_engineering: "#EFB341"
      cpu_security: "#DE3A3A"
      cpu_science: "#D381C9"
      cpu_supply: "#A46106"
  - type: StaticPrice
    price: 250
  - type: Rotatable # Frontier
  - type: BindToStation # Frontier

- type: entity
  parent: BaseFlatpack
  id: SolarAssemblyFlatpack
  name: 太陽能組件平裝盒
  description: 用於組裝太陽能系統的平裝套件。
  components:
  - type: Flatpack
    entity: SolarAssembly
  - type: Sprite
    layers:
    - state: solar-assembly-part
  - type: StaticPrice
    price: 25 # Frontier: 75<25

- type: entity
  parent: BaseFlatpack
  id: AmePartFlatpack
  name: AME flatpack
  description: 用於組裝反物質引擎反應器的組裝式套件。
  components:
  - type: Sprite
    layers:
    - state: ame-part
  - type: Flatpack
    entity: AmeShielding
  - type: StaticPrice
    price: 500
  - type: GuideHelp
    guides:
    - AME
    - Power
  - type: StealTarget
    stealGroup: AmePartFlatpack

