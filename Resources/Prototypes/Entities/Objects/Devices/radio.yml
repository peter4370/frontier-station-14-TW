- type: entity
  name: 手持式無線電
  description: 一款方便攜帶的手持收音機。
  parent: [BaseItem, RecyclableItemDeviceSmall] # Frontier: added RecyclableItemDeviceSmall
  id: RadioHandheld
  components:
  - type: TelecomExempt
  # Frontier: Reworked handheld radios
  # - type: RadioMicrophone
  #   broadcastChannel: Handheld
  # - type: RadioSpeaker
  #   channels:
  #   - Handheld
  - type: HandheldRadio
    channel: Handheld
  - type: ActiveListener
  - type: ActiveRadio
  # End Frontier
  - type: Speech
    speechVerb: Robotic
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    layers:
    - state: walkietalkie
    - state: walkietalkie-on
    state: walkietalkie
  - type: Item
    sprite: Objects/Devices/communication.rsi
    heldPrefix: walkietalkie
  - type: Tag
    tags:
    - Radio

- type: entity
  name: 安全無線電
  description: 一款方便攜帶的安保無線電。
  parent: [ RadioHandheld, BaseC2ContrabandUnredeemable ] # Frontier: BaseSecurityContraband<BaseC2ContrabandUnredeemable
  id: RadioHandheldSecurity
  components:
  # Frontier: Reworked handheld radios
  # - type: RadioMicrophone
  #   broadcastChannel: Security
  #   listenRange: 1
  # - type: RadioSpeaker
  #   channels:
  #   - Security
  - type: HandheldRadio
    channel: Security
  - type: ActiveListener
  - type: ActiveRadio
  # End Frontier
  - type: Sprite
    sprite: Objects/Devices/securityhandy.rsi
  - type: Item
    sprite: Objects/Devices/securityhandy.rsi
    heldPrefix: walkietalkie
