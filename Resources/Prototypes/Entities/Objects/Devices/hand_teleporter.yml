- type: entity
  id: HandTeleporter
  parent: [BaseItem, BaseC2ContrabandUnredeemable] # Frontier: BaseC2ContrabandUnredeemable
  name: hand teleporter
  description: "Nanotrasen 的招牌商品——僅採用最頂級的藍域科技。使用說明：使用一次可建立一個隨機傳送的傳送門；再次使用可將其與您當前位置的傳送門連結；再次使用可清除所有傳送門。"
  components:
  - type: Sprite
    sprite: /Textures/Objects/Devices/hand_teleporter.rsi
    layers:
    - state: icon
  - type: HandTeleporter
  - type: Tag
    tags:
    - HighRiskItem
  - type: StealTarget
    stealGroup: HandTeleporter

- type: entity
  id: HandTeleporterAdmeme
  suffix: Admeme
  parent: BaseItem
  name: 跨維度傳送器
  description: 可讓你開啟不受距離限制的穩定傳送門。
  categories: [HideSpawnMenu] # Frontier: use NF variant
  components:
  - type: Sprite
    sprite: /Textures/Objects/Devices/hand_teleporter.rsi
    layers:
    - state: icon
      color: green
  - type: HandTeleporter
    allowPortalsOnDifferentGrids: true
    allowPortalsOnDifferentMaps: true
    firstPortalPrototype: PortalGatewayBlue
    secondPortalPrototype: PortalGatewayOrange
