- type: entity
  id: BasePowerCell
  abstract: true
  parent: BaseItem
  components:
  - type: Item
    storedRotation: -90
  - type: Battery
    pricePerJoule: 0.15
  - type: PowerCell
  - type: Explosive
    explosionType: Default
    maxIntensity: 200
    intensitySlope: 1.5
  - type: Sprite
    sprite: Objects/Power/power_cells.rsi
  - type: SolutionContainerManager
    solutions:
      battery:
        maxVol: 5
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Extractable
    juiceSolution:
      reagents:
        - ReagentId: Zinc
          Quantity: 5
  - type: Tag
    tags:
      - PowerCell
  - type: Appearance
  - type: PowerCellVisuals
  - type: Riggable

- type: entity
  name: 馬鈴薯電池
  description: 有人把兩顆釘子和一些鐵絲插進了一顆大馬鈴薯裡。不知為何，這竟能產生一點電荷。
  id: PowerCellPotato
  parent: [BasePowerCell, RecyclableItemNoMats] # Frontier: added RecyclableItemNoMats
  components:
  - type: Sprite
    layers:
    - state: potato
  - type: Battery
    maxCharge: 70
    startingCharge: 70
  - type: Tag
    tags:
      - PotatoBattery
  - type: Construction
    graph: PowerCellPotato
    node: potatobattery
  - type: MachinePart # Frontier
    part: PowerCell # Frontier
    rating: 1 # Frontier: ideally 0

- type: entity
  name: 小容量電源電池
  description: 一款可充電電池。這是市面上最便宜的款式。
  id: PowerCellSmall
  suffix: Full
  parent: [BasePowerCell, RecyclableItemSteelTiny] # Frontier: added RecyclableItemSteelTiny
  components:
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: small
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
  - type: Battery
    maxCharge: 360
    startingCharge: 360
  - type: Tag
    tags:
      - PowerCellSmall
  - type: MachinePart # Frontier
    part: PowerCell # Frontier
    rating: 1 # Frontier

- type: entity
  id: PowerCellSmallPrinted
  suffix: Empty
