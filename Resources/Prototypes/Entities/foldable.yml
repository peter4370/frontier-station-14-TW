- type: entity
  id: BaseFoldable
  name: "可摺疊的"
  abstract: true
  components:
  - type: Foldable
  - type: GenericVisualizer
    visuals:
      enum.FoldedVisuals.State:
        foldedLayer:
          True: {visible: true}
          False: {visible: false}
        unfoldedLayer:
          True: {visible: false}
          False: {visible: true}

- type: entity
  abstract: true
  parent: BaseFoldable
  id: BaseDeployFoldable
  name: "部署可摺疊裝置"
  components:
  - type: DeployFoldable
