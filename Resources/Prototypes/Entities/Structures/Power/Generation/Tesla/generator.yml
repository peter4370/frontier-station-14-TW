- type: entity
  id: TeslaGenerator
  name: 特斯拉發電機
  parent: [BaseC2ContrabandEngineeringUnredeemable, BaseStructureDynamic] # Frontier: add BaseC2ContrabandEngineeringUnredeemable
  description: 一種奇特的裝置，一旦啟動便會產生強大的特斯拉球。配備有臨時關機的封存安全機制。
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Power/Generation/Tesla/generator.rsi
    state: icon
  - type: SingularityGenerator # TODO: rename the generator
    spawnId: TeslaEnergyBall
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          # Using a circle here makes it a lot easier to pull it all the way from Cargo
          !type:PhysShapeCircle
            radius: 0.45
        density: 190
        # Keep an eye on ParticlesProjectile when adjusting these
        mask:
        - MachineMask
        layer:
        - Opaque
  - type: Anchorable
  - type: GuideHelp
    guides:
    - TeslaEngine
    - Power

