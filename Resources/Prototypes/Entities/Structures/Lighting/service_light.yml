- type: entity
  parent: Poweredlight
  id: JanitorServiceLight
  name: 清潔服務燈
  description: 一塊懸掛在牆上的清潔服務標誌。若燈號閃爍，即表示需要清潔人員提供服務。
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/service_light.rsi
    drawdepth: WallMountedItems
    layers:
    - map: ["enum.PoweredLightLayers.Base"]
      state: base
    - map: ["enum.PoweredLightLayers.Glow"]
      state: glow
      shader: unshaded
    state: base
  - type: PointLight
    radius: 1.5
    energy: 0.45
    softness: 3
    offset: "0, 0"
    enabled: false
  - type: PoweredLight
    bulb: Bulb
    on: false
    hasLampOnSpawn: ServiceLightBulb
  - type: DamageOnInteract
    damage:
      types:
        Heat: 5
    popupText: powered-light-component-burn-hand
