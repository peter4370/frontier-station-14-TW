- type: entity
  parent: ReagentDispenserBase
  id: SodaDispenserEmpty
  name: 蘇打水機
  description: 一款提供各種汽水及其他常見飲品的飲料自動販賣機。設有單一裝填槽，供放置容器使用。
  suffix: Empty
  components:
  - type: Rotatable
  - type: Sprite
    sprite: Structures/smalldispensers.rsi
    drawdepth: SmallObjects
    state: soda
  - type: Storage
    openOnActivate: false
    whitelist:
      tags:
      - DrinkBottle
  - type: Transform
    noRot: false
  - type: Machine
    board: SodaDispenserMachineCircuitboard
  - type: GuideHelp
    guides:
    - Bartender
    - Drinks
  - type: StaticPrice # Frontier
    price: 500 # Frontier

