- type: entity
  parent: BaseSign
  id: BaseFlag
  abstract: true
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/flags.rsi
    # Begin DeltaV additions - Craftable Pride Flags
  - type: StaticPrice
    price: 25
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger: !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialCloth:
            min: 5
            max: 5
        offset: 0
    # End DeltaV additions

- type: entity
  parent: BaseFlag
  id: BlankFlag
  name: 空白旗幟
  description: 一塊白色的布。絕對不是法國國旗。
  components:
  - type: Sprite
    state: blank_flag
    # Begin Frontier additions
  - type: Construction
    graph: NF_Flags
    node: BlankFlag
    # End Frontier additions

