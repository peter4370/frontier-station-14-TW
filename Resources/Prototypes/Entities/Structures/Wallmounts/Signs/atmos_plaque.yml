- type: entity
  parent: MarkerBase
  id: PlaqueAtmos
  name: atmos 斑塊生成器
  suffix: Spawner
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: Structures/Wallmounts/signs.rsi
      state: atmosplaque
  - type: EntityTableSpawner
    table: !type:GroupSelector
      children:
      - id: PlaqueAtmosZUM
        weight: 1
      - id: PlaqueAtmosFEA
        weight: 9
      - id: PlaqueAtmosZAS
        weight: 45
      - id: PlaqueAtmosLINDA
        weight: 45
    offset: 0.0

# individual plaques aren't placeable. you will not defy the randomness.

- type: entity
  parent: BaseSign
  id: PlaqueAtmosFEA
  name: FEA 大氣部門紀念牌匾
  description: 這塊紀念牌旨在紀念 Atmos FEA 部門的覆滅。謹以此紀念所有在其手中喪生、渾身焦黑、神志恍惚且虛弱不堪的男子。
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: atmosplaque

- type: entity
  parent: PlaqueAtmosFEA
  id: PlaqueAtmosLINDA
  name: LINDA 大氣部門 紀念牌匾
  description: 這塊紀念牌旨在紀念「Atmos LINDA」師團的覆滅。謹以此紀念所有在該師團手中喪生、渾身焦黑、神智恍惚且虛弱不堪的士兵。
  categories: [ HideSpawnMenu ]

- type: entity
  parent: PlaqueAtmosFEA
  id: PlaqueAtmosZAS
  name: ZAS 大氣部門紀念牌匾
  description: 這塊紀念牌旨在紀念「Atmos ZAS」師團的覆滅。謹以此紀念所有在其手中喪生、渾身焦黑、暈眩不已且虛弱不堪的士兵。
  categories: [ HideSpawnMenu ]

# If you get the ZUM plaque it means your round will be blessed with good engineering luck.
- type: entity
  parent: PlaqueAtmosFEA
  id: PlaqueAtmosZUM
  name: ZUM 大氣部門紀念牌
  description: 這塊紀念牌旨在紀念 Atmos ZUM 部門的崛起。願他們能繼承 Atmos ZAS、LINDA 及 FEA 部門所留下的火炬。
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: zumosplaque
