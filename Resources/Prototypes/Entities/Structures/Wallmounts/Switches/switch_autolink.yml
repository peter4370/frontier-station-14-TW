# AutoLink variants of SignalButton (from Outer Rim)

- type: entity
  id: SignalButtonExt1
  parent: SignalButton
  name: 外部按鈕 1
  suffix: Autolink, Ext1
  categories: [ HideSpawnMenu ] # Frontier: they can link with autolink shutters/blastdoors in other ships
  components:
    - type: AutoLinkTransmitter
      channel: Ext1

