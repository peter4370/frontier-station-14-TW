- type: entity
  id: BannerBase
  parent: BaseStructureDynamic
  name: 底部橫幅
  description: 這是橫幅的概念，你原本不應該看到這個。
  abstract: true
  components:
  - type: Sprite
    sprite: _NF/Structures/Decoration/banner.rsi # Frontier - unique sprites
    state: banner
    noRot: true
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 190
        mask:
        - TableMask # Frontier - MachineMask<TableMask
        # layer:
        # - Opaque
        # - MidImpassable
        # - HighImpassable
        # - BulletImpassable
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior # Frontier
        spawn: # Frontier
          MaterialCloth1: # Frontier
            min: 1 # Frontier
            max: 2 # Frontier
          SheetSteel1: # Frontier
            min: 1 # Frontier
            max: 2 # Frontier

- type: entity
