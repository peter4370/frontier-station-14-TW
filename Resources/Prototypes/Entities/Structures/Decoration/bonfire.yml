- type: entity
  id: Bonfire
  parent: BaseStructure
  name: 篝火
  description: 還有什麼比在深夜時分，在星空下與朋友們一起彈吉他更美好的呢？
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/bonfire.rsi
    layers:
      - state: bonfire
      - state: burning
  - type: PointLight
    radius: 5
    energy: 3
    color: "#FFC90C"
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 50
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
  - type: AmbientSound
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: AlwaysHot
  - type: Construction # Frontier
    graph: FiresGraph # Frontier
    node: BonfireNode # Frontier

- type: entity
  id: LegionnaireBonfire
  parent: Bonfire
  name: 軍團士兵的篝火
  description: 在那裡，在熔岩與火山灰交織的土地上，正是烤棉花糖和馬鈴薯的好地方。
  components:
  - type: Sprite
    layers:
      - state: legionnaire_bonfire
  - type: PointLight
    color: "#FF5601"
