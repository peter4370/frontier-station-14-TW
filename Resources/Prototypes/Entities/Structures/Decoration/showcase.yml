- type: entity
  id: BaseShowcaseRobot
  abstract: true
  parent: BaseStructure
  name: 安全機器人展示會
  description: 一具舊式安保機器人的非功能性複製品。
  components:
    - type: Anchorable
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: Metallic
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 150
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 75
          behaviors:
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                PartRodMetal1:
                  min: 5
                  max: 10
            - !type:DoActsBehavior
              acts: [ "Destruction" ]

- type: entity
  id: ShowcaseRobot
  parent: BaseShowcaseRobot
  name: security robot showcase
  description: A non-functional replica of an old security robot.
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_1

- type: entity
  id: ShowcaseRobotWhite
  parent: BaseShowcaseRobot
  name: 白色機器人展示櫃
  description: 一具無法運作的舊式機器人複製品。
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_2

- type: entity
  id: ShowcaseRobotAntique
  parent: BaseShowcaseRobot
  name: 貨運機器人展示
  description: 一具舊式貨運機器人的非功能性複製品。
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_3

- type: entity
  id: ShowcaseRobotMarauder
  parent: BaseShowcaseRobot
  name: '「掠奪者」特輯'
  description: 一尊塗成綠色的掠奪者模型，無法運作。
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_4
